# Reviewed capability allowlist for AutoFDE's SREGym diagnosing pipeline.
#
# Authority rule: the external GymAct capability graph is not ambient
# execution authority. `CapabilityGate` admits only the exact bindings below;
# a new upstream capability is refused until this manifest is deliberately
# reviewed, and an entry that disappears upstream is treated as stale drift.
#
# Exact reviewed upstream subject:
#   seanchatmangpt/gymact@5a40c8f402aeb14699e216e17b2ef7aae9f0bc8f
#   src/gymact/gyms/sregym.py blob c7d669253693f1275a0f413d816d7ec00d691bfe
#   SREGYM_CAPABILITIES
#
# All current SREGym capabilities are Consequence.DO in GymAct because its
# named-capability invocation path is `gym.act()`/Environment.actuate(). Some
# entries below are semantically observations, but the consequence value here
# records the real upstream execution classification rather than inventing a
# second taxonomy. BRCE/GymAct authority remains responsible for actual DO.

[gymact]
environment = "sregym"
source_repo = "seanchatmangpt/gymact"
source_sha = "5a40c8f402aeb14699e216e17b2ef7aae9f0bc8f"
source_blob = "c7d669253693f1275a0f413d816d7ec00d691bfe"

[[capability]]
name = "observe_cluster_state"
consequence = "DO"
reason = "Read the real SREGym conductor status through its named capability path."

[[capability]]
name = "run_kubectl"
consequence = "DO"
reason = "Execute a bounded kubectl diagnostic command through the real kubectl MCP surface."

[[capability]]
name = "get_benchmark_status"
consequence = "DO"
reason = "Read the real conductor benchmark-stage status."

[[capability]]
name = "jaeger_get_services"
consequence = "DO"
reason = "Query real Jaeger service identities for distributed-trace diagnosis."

[[capability]]
name = "jaeger_get_operations"
consequence = "DO"
reason = "Query real Jaeger operations for one service."

[[capability]]
name = "jaeger_get_traces"
consequence = "DO"
reason = "Query real Jaeger traces for one service and bounded time window."

[[capability]]
name = "jaeger_get_dependency_graph"
consequence = "DO"
reason = "Query the real Jaeger service dependency graph for process/dependency diagnosis."

[[capability]]
name = "loki_get_logs"
consequence = "DO"
reason = "Query real Loki logs with caller-supplied LogQL and a bounded time window."

[[capability]]
name = "loki_get_labels"
consequence = "DO"
reason = "Query real Loki label names for evidence discovery."

[[capability]]
name = "loki_get_label_values"
consequence = "DO"
reason = "Query real values for one Loki label."

[[capability]]
name = "prometheus_get_metrics"
consequence = "DO"
reason = "Query real Prometheus metrics with caller-supplied PromQL."

[[capability]]
name = "prometheus_get_alerts"
consequence = "DO"
reason = "Query real currently firing Prometheus alerts."

[[capability]]
name = "submit_diagnosis"
consequence = "DO"
reason = "Submit the agent's own diagnosis to the real SREGym conductor; never read grading ground truth."

[[capability]]
name = "submit_mitigation"
consequence = "DO"
reason = "Submit the agent's own mitigation to the real SREGym conductor; never read grading ground truth."

# Deliberately excluded: any future binding that exposes injected-fault ground
# truth, scoring internals, or any other unreviewed capability. `verify()` is
# not a SREGYM_CAPABILITIES entry and therefore does not belong in this list.
