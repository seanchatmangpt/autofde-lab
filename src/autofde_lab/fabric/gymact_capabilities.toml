# Capability allowlist for autofde-lab's SREGym diagnosing pipeline
# (src/autofde_lab/reasoning/sregym_pipeline.py -> gymact.gyms.sregym.SregymEnvironment).
#
# This is the enforcement boundary named in runner.py's non-actuation-boundary
# docstring for the case where gymact is the target environment: the
# diagnosing agent may only construct/call a gymact `Capability` whose
# `binding` name is listed below. `gymact_capability_gate.py` (this file's
# loader, in the same src/autofde_lab/fabric/ directory) reads this file and
# refuses (CapabilityRefused) any other binding name -- including names that
# don't exist yet in gymact today. Adding a capability here is therefore a
# deliberate, reviewed act, not something that happens by omission.
#
# This manifest lives under src/autofde_lab/fabric/, not under
# src/autofde_lab/gymact/ -- this repo's real gymact usage is the external
# ~/gymact package (`import gymact`) directly, never a local wrapper/shadow
# package of that name.
#
# Real capability set verified this session directly from
# `~/gymact/src/gymact/gyms/sregym.py`'s `SREGYM_CAPABILITIES` tuple (5
# entries; there is no jaeger/loki/prometheus capability in the real gymact
# source -- only these 5 exist). `SregymEnvironment.verify()` is NOT a
# `Capability` at all: it is a plain coroutine method on the environment,
# never wrapped in the `actuate(capability, payload)` dispatch table, so it
# is structurally unreachable through this capability surface regardless of
# what this file lists. That is the concrete mechanism that keeps
# ground-truth/scoring internals gymact-side: they were never exposed as an
# invocable capability to begin with, and this allowlist additionally
# guards against a *future* gymact capability quietly adding such exposure
# and the diagnosing pipeline picking it up unreviewed.

[gymact]
# Environment provider this manifest applies to (informational; the gate
# does not currently branch on provider name, but recording it makes an
# eventual second-environment manifest an additive change, not a rewrite).
environment = "sregym"

[[capability]]
name = "observe_cluster_state"
consequence = "READ"
reason = "Reads sregym's real conductor /status endpoint. Pure diagnostic observation, no ground truth."

[[capability]]
name = "run_kubectl"
consequence = "DO"
reason = "Executes a real kubectl command through sregym's kubectl-mcp server. The core diagnostic tool surface (inspect pods, logs, events, describe resources) -- classified DO because it runs an arbitrary read-leaning kubectl command, not because it exposes ground truth."

[[capability]]
name = "get_benchmark_status"
consequence = "READ"
reason = "Reads sregym's conductor /status endpoint (benchmark-stage view). Pure diagnostic observation, no ground truth."

[[capability]]
name = "submit_diagnosis"
consequence = "DO"
reason = "Submits the agent's OWN diagnosis to sregym's conductor for external grading. This is the diagnosing pipeline's required deliverable action, not a ground-truth read -- it sends the agent's answer outward, it does not read gymact's answer key. Excluding it would make the pipeline unable to complete its job."

[[capability]]
name = "submit_mitigation"
consequence = "DO"
reason = "Submits the agent's OWN mitigation to sregym's conductor for external grading. Same rationale as submit_diagnosis: outbound submission of the agent's own answer, not a read of ground truth."

# NOTE: "verify" is deliberately NOT listed here. An earlier pass in this
# session added a fake "verify" entry so gymact_diagnosis_driver's
# gymact_verify binding could be constructed as a GatedCapabilityBinding --
# but CapabilityGate.stale_entries() correctly flagged this as drift (no
# real gymact.gyms.sregym.SREGYM_CAPABILITIES entry is named "verify").
# Fixed forward in runner.py: gymact_verify now takes a bare ActionBinding
# (same rule as the original nine read-only labels), since
# SregymEnvironment.verify() was never a gated Capability to begin with --
# it is a plain coroutine, never wired into actuate()'s dispatch table.
# Padding this manifest with a fictitious capability to make unrelated code
# typecheck would have been exactly the kind of false authorization this
# allowlist exists to prevent.

# Deliberately NOT listed, and therefore refused by capability_gate.py even
# if gymact adds a same-shaped Capability under one of these names in a
# future revision without this manifest being reviewed and updated:
#   - anything that would read injected-fault ground truth (e.g. a
#     hypothetical "get_injected_fault" / "read_fault_spec" capability)
#   - anything that would read or drive scoring internals beyond the
#     bounded pass/fail + observed-state shape verify() itself already
#     returns (e.g. a hypothetical "score_submission" capability that
#     exposes the grading rubric) -- the "verify" entry above lists only
#     verify() itself, admitted narrowly for the reason given there.
#
# capability_gate.py checks capability `.binding` values duck-typed against
# real `gymact.gyms.sregym.Capability`/`SREGYM_CAPABILITIES` objects -- it
# imports gymact directly when validating real Capability instances, it
# never re-implements gymact's own capability model locally.
