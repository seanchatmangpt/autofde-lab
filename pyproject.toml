[project]
name = "autofde-lab"
description = "AutoFDE Lab: exploration, falsification, and proof environment for persistent, governed AutoFDE capabilities. Forked from scikit-decide."
authors=[
  {name= "Sean Chatman",  email = "sean@chatmangpt.com"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["reinforcement learning", "planning", "scheduling"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "pynng>=0.6.2",
    "pathos>=0.2.7",
    "discrete-optimization>=0.9.0",
    "wrapt>=2.2.1",
]

[project.urls]
documentation = "https://seanchatmangpt.github.io/autofde-lab/"
repository = "https://github.com/seanchatmangpt/autofde-lab"
upstream = "https://github.com/airbus/scikit-decide"

[project.optional-dependencies]
shared = [  # define a common extra to avoid redefining dependencies in both domains and solvers
    "gymnasium>=0.29.1,<2",  # verified real: gymnasium>=1 is required by ray[rllib]>=2.52.1 (real
    # gymnasium.VectorizeMode import at rllib import time) and works with GymDomain (real
    # PPO train+rollout via RayRLlib on gymnasium==1.3.0); <2 matches stable-baselines3's own
    # real declared ceiling (gymnasium<2.0,>=0.29.1). AsLegacyGymV21Env/AsGymnasiumEnv (which
    # wrap pre-gymnasium legacy `gym` environments) require gymnasium<1's now-removed
    # EnvCompatibility/LegacyEnv classes and raise a clear real ImportError if instantiated
    # on gymnasium>=1 -- see autofde_lab/hub/domain/gym/gym.py.
    "numpy>=2.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy >=1.20.1,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "scipy>=1.9.2",
    "unified-planning>=1.1,<1.3",
]
domains = [
    "autofde-lab[shared]", # self-reference allowed by pip since 21.2 (https://github.com/pypa/pip/issues/11296)
    "matplotlib>=3.3.4",
    "openap>=1.5",
    "pygeodesy>=23.6.12",
    "cartopy>=0.22.0",
    "pygrib>=2.1.6; sys_platform == 'linux'",
    "pygrib>=2.1.6; sys_platform == 'darwin' and platform_machine != 'x86_64'",
    "pygrib==2.1.5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "setuptools<82.0.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",  # pkg_resources removed from 82.0.0, and needed by pygrib 2.1.5
    "pyRDDLGym>=2.3, !=2.7",  # verified real: pyRDDLGym 2.6 installs and works (RDDLDomain construction + rollout) on Python 3.13; the `!=2.7` exclusion is unrelated to 3.13 (https://github.com/pyrddlgym-project/pyRDDLGym-gurobi/issues/6) and is kept as-is
    "pyRDDLGym-rl>=0.2",  # verified real: autofde_lab.hub.domain.rddl unconditionally imports this (SimplifiedActionRDDLEnv), so it's load-bearing, not optional
    "numpy<2.4",  # pyRDDLGym-rl 0.2 (still the latest release on PyPI, uploaded 2024-11-03) calls np.reshape(newshape=...) in SimplifiedActionRDDLEnv; numpy 2.4.0 removed the `newshape` kwarg (deprecated since 2.1, removed in 2.4 per https://numpy.org/doc/2.4/release/2.4.0-notes.html), breaking it on ALL Python versions including 3.13, not just <3.13 as previously assumed here. The upstream fix (https://github.com/pyrddlgym-project/pyRDDLGym-rl/pull/10, merged 2026-03-02) has not been released to PyPI yet -- see https://github.com/pyrddlgym-project/pyRDDLGym-rl/issues/9. Re-narrow this pin once a fixed release ships.
    "rddlrepository>=2.1",
    "plado>=0.1.3",
    "pytz>=2025.2",
]
solvers = [
    "autofde-lab[shared]", # self-reference allowed by pip since 21.2 (https://github.com/pypa/pip/issues/11296)
    "joblib>=1.0.1",
    "ray[rllib]>=2.52.1",  # verified real: 2.52.1 is the first PyPI release with cp313 wheels
    # (previously pinned <2.38 because ray made rllib's "new API stack" the default from 2.38/2.40
    # onward, which this solver's old-stack-specific code -- RolloutWorker subclassing,
    # local_worker(), Policy-based masking models -- cannot use; the solver now explicitly opts
    # into the old stack via `.api_stack(enable_rl_module_and_learner=False,
    # enable_env_runner_and_connector_v2=False)` when building its own default config, so the
    # upper bound is no longer needed -- real PPO train+rollout verified on ray==2.52.1).
    "stable-baselines3>=2",
    "sb3_contrib>=2.3",
    "up-tamer>=1.1.2; python_version < '3.12' and platform_machine == 'x86_64'",
    "up-fast-downward>=0.4.1",
    "up-enhsp>=0.0.25, <0.0.28",
    "up-pyperplan>=1.1.0",
    "pyRDDLGym-jax>=2.5",  # verified real: pyRDDLGym-jax 3.1 (py3-none-any wheel) installs on Python 3.13 with jax/jaxlib 0.11.0 (both have cp313 wheels); RDDLJaxSolver imports and actually solves CartPole_Continuous_gym via rddlrepository on Python 3.13 (tests/solvers/python/test_pyrddlgym_solvers.py::test_pyrddlgymdomain_jax)
    "jax>=0.4; sys_platform == 'linux' or sys_platform == 'darwin'",
    "jax>=0.4, <0.6; sys_platform == 'win32'",
    "pyRDDLGym-gurobi>=0.2",  # verified real: pyRDDLGym-gurobi 0.2 (py3-none-any wheel) installs on Python 3.13; RDDLGurobiSolver imports and actually solves CartPole_Continuous_gym via rddlrepository on Python 3.13 with the already-pinned pyRDDLGym==2.6 (tests/solvers/python/test_pyrddlgym_solvers.py::test_pyrddlgymdomain_gurobi); not separately verified against a paid Gurobi license (the test's small instance ran without one)
    "torch-geometric>=2.5",
    "torch>=2.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch>=2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch!=2.9.0,!=2.9.1,!=2.10, !=2.11.0, !=2.12.0, !=2.12.1; sys_platform == 'win32'",
    "flax>=0.10.6; (sys_platform == 'linux' or sys_platform == 'win32') and python_version >= '3.12'",
    "openevolve>=0.2.11",
]
pddl = [
    "z3-solver",
]
dspy = [
    "dspy",  # unpinned: DSPyPolicy always targets the most recent dspy release
]
all = [
    # self-reference allowed by pip since 21.2 (https://github.com/pypa/pip/issues/11296)
    "autofde-lab[domains, solvers, pddl, dspy]",
]

[project.entry-points."autofde_lab.domains"]
GymDomain = "autofde_lab.hub.domain.gym:GymDomain [domains]"
DeterministicGymDomain = "autofde_lab.hub.domain.gym:DeterministicGymDomain [domains]"
CostDeterministicGymDomain = "autofde_lab.hub.domain.gym:CostDeterministicGymDomain [domains]"
GymPlanningDomain = "autofde_lab.hub.domain.gym:GymPlanningDomain [domains]"
GymWidthDomain = "autofde_lab.hub.domain.gym:GymWidthDomain [domains]"
UPDomain = "autofde_lab.hub.domain.up:UPDomain [domains]"
MasterMind = "autofde_lab.hub.domain.mastermind:MasterMind [domains]"
Maze = "autofde_lab.hub.domain.maze:Maze [domains]"
RockPaperScissors = "autofde_lab.hub.domain.rock_paper_scissors:RockPaperScissors [domains]"
SimpleGridWorld = "autofde_lab.hub.domain.simple_grid_world:SimpleGridWorld [domains]"
ChatmanCleanSession = "autofde_lab.hub.domain.chatman_clean_session:ChatmanCleanSessionDomain"
FlightPlanningDomain = "autofde_lab.hub.domain.flight_planning:FlightPlanningDomain [domains]"
MRCPSP = "autofde_lab.hub.domain.rcpsp:MRCPSP [domains]"
MRCPSPCalendar = "autofde_lab.hub.domain.rcpsp:MRCPSPCalendar [domains]"
RCPSP = "autofde_lab.hub.domain.rcpsp:RCPSP [domains]"
RCPSPCalendar = "autofde_lab.hub.domain.rcpsp:RCPSPCalendar [domains]"
Stochastic_RCPSP = "autofde_lab.hub.domain.rcpsp:Stochastic_RCPSP [domains]"
SMRCPSPCalendar = "autofde_lab.hub.domain.rcpsp:SMRCPSPCalendar [domains]"
MSRCPSP = "autofde_lab.hub.domain.rcpsp:MSRCPSP [domains]"
MSRCPSPCalendar = "autofde_lab.hub.domain.rcpsp:MSRCPSPCalendar [domains]"
RDDLDomain = "autofde_lab.hub.domain.rddl:RDDLDomain [domains]"
RDDLDomainRL = "autofde_lab.hub.domain.rddl:RDDLDomainRL [domains]"
RDDLDomainSimplifiedSpaces = "autofde_lab.hub.domain.rddl:RDDLDomainSimplifiedSpaces [domains]"
PDDLDomain = "autofde_lab.hub.domain.pddl:PDDLDomain [domains]"
PPDDLDomain = "autofde_lab.hub.domain.pddl:PPDDLDomain [domains]"
TPDDLDomain = "autofde_lab.hub.domain.pddl:TPDDLDomain [pddl]"

[project.entry-points."autofde_lab.solvers"]
AOstar = "autofde_lab.hub.solver.aostar:AOstar [solvers]"
Astar = "autofde_lab.hub.solver.astar:Astar [solvers]"
pLRTAstar = "autofde_lab.hub.solver.lrtastar:LRTAstar [solvers]"
LRTAstar = "autofde_lab.hub.solver.lrtdp:LRTAstar [solvers]"
MCTS = "autofde_lab.hub.solver.mcts:MCTS [solvers]"
UCT = "autofde_lab.hub.solver.mcts:UCT [solvers]"
AugmentedRandomSearch = "autofde_lab.hub.solver.ars:AugmentedRandomSearch [solvers]"
BFWS = "autofde_lab.hub.solver.bfws:BFWS [solvers]"
CGP = "autofde_lab.hub.solver.cgp:CGP [solvers]"
IW = "autofde_lab.hub.solver.iw:IW [solvers]"
RIW = "autofde_lab.hub.solver.riw:RIW [solvers]"
LRTDP = "autofde_lab.hub.solver.lrtdp:LRTDP [solvers]"
ILAOstar = "autofde_lab.hub.solver.ilaostar:ILAOstar [solvers]"
pAstar = "autofde_lab.hub.solver.p_astar:Astar [solvers]"
MARTDP = "autofde_lab.hub.solver.martdp:MARTDP [solvers]"
MAHD = "autofde_lab.hub.solver.mahd:MAHD [solvers]"
MaxentIRL = "autofde_lab.hub.solver.maxent_irl:MaxentIRL [solvers]"
POMCP = "autofde_lab.hub.solver.pomcp:POMCP [solvers]"
pPOMCP = "autofde_lab.hub.solver.pomcp:pPOMCP [solvers]"
RayRLlib = "autofde_lab.hub.solver.ray_rllib:RayRLlib [solvers]"
SimpleGreedy = "autofde_lab.hub.solver.simple_greedy:SimpleGreedy [solvers]"
StableBaseline = "autofde_lab.hub.solver.stable_baselines:StableBaseline [solvers]"
DOSolver = "autofde_lab.hub.solver.do_solver:DOSolver [solvers]"
GPHH = "autofde_lab.hub.solver.do_solver:GPHH [solvers]"
PilePolicy = "autofde_lab.hub.solver.pile_policy_scheduling:PilePolicy [solvers]"
UPSolver = "autofde_lab.hub.solver.up:UPSolver [solvers]"
RDDLJaxSolver = "autofde_lab.hub.solver.rddl:RDDLJaxSolver [solvers]"
RDDLGurobiSolver = "autofde_lab.hub.solver.rddl:RDDLGurobiSolver [solvers]"
VI = "autofde_lab.hub.solver.vi:VI [solvers]"
PI = "autofde_lab.hub.solver.pi:PI [solvers]"
LDFS = "autofde_lab.hub.solver.ldfs:LDFS [solvers]"
IDAstar = "autofde_lab.hub.solver.ldfs:IDAstar [solvers]"
RTDPBel = "autofde_lab.hub.solver.rtdp_bel:RTDPBel [solvers]"
SSiPP = "autofde_lab.hub.solver.ssipp:SSiPP [solvers]"
FRET = "autofde_lab.hub.solver.fret:FRET [solvers]"
MDPLP = "autofde_lab.hub.solver.mdplp:MDPLP [solvers]"
SSPLP = "autofde_lab.hub.solver.mdplp:SSPLP [solvers]"
IDual = "autofde_lab.hub.solver.idual:IDual [solvers]"
CIDual = "autofde_lab.hub.solver.idual:CIDual [solvers]"
GPCI = "autofde_lab.hub.solver.gpci:GPCI [solvers]"
SARSOP = "autofde_lab.hub.solver.sarsop:SARSOP [solvers]"
DESPOT = "autofde_lab.hub.solver.despot:DESPOT [solvers]"
EHC = "autofde_lab.hub.solver.ehc:EHC [solvers]"
FF = "autofde_lab.hub.solver.pddl.ff:FF [solvers]"
FFReplan = "autofde_lab.hub.solver.pddl.ppddlreplan:FFReplan [solvers]"
PPDDLReplan = "autofde_lab.hub.solver.pddl.ppddlreplan:PPDDLReplan [solvers]"
FFDetHindsight = "autofde_lab.hub.solver.pddl.ppddldethindsight:FFDetHindsight [solvers]"
PPDDLDetHindsight = "autofde_lab.hub.solver.pddl.ppddldethindsight:PPDDLDetHindsight [solvers]"
SSPReplan = "autofde_lab.hub.solver.sspreplan:SSPReplan [solvers]"
SSPDetHindsight = "autofde_lab.hub.solver.sspdethindsight:SSPDetHindsight [solvers]"
RFF = "autofde_lab.hub.solver.pddl.ppddlplanmerger:RFF [solvers]"
PPDDLPlanMerger = "autofde_lab.hub.solver.pddl.ppddlplanmerger:PPDDLPlanMerger [solvers]"
SSPPlanMerger = "autofde_lab.hub.solver.sspplanmerger:SSPPlanMerger [solvers]"
Witness = "autofde_lab.hub.solver.witness:Witness [solvers]"
HSVI = "autofde_lab.hub.solver.hsvi:HSVI [solvers]"
