DSPyPolicy = "autofde_lab.hub.solver.dspy_policy:DSPyPolicy [dspy]"

[dependency-groups]
dev = [
    "docopt>=0.6.2",
    "jupyter>=1.1.1",
    "python-dotenv>=1.2.1",
]
test = [
    "pytest>=6.2.2,<8.4", # pytest 8.4 not yet compatible with pytest-cases
    "pytest-cov>=2.11.1",
    "pytest-timeout>=2.2",
    "tqdm>=4.66.3",
    "nbmake>=1.0",
    "docopt>=0.6.2",
    "commonmark>=0.9.1",
    "graph-jsp-env>=1",
    "pytest-cases>=3.8",
    "optuna>=4.5.0",
]

[tool.uv]
default-groups = "all"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[build-system]
requires = ["scikit-build-core>=0.11.6,<1"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
logging.level = "INFO"
sdist.exclude = ["cpp/tests/data"]
wheel.packages = ["src/autofde_lab", "src/skdecide"]
wheel.install-dir = "autofde_lab/hub"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
cmake.source-dir = "cpp"
build-dir = "build/{wheel_tag}"  # speedup rebuilds (https://scikit-build-core.readthedocs.io/en/latest/configuration/index.html#other-options)

[tool.scikit-build.cmake.define]
ONLY_PYTHON = true

[tool.setuptools_scm]
