name: Export CI refactor inputs

on:
  pull_request:
    paths:
      - ".github/workflows/cache-format-export.yml"
      - ".github/workflows/ci.yml"
      - "src/skdecide/_cache/**"
      - "tests/test_caching.py"
      - "tests/test_enterprise_cache.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install deterministic tooling
        run: python -m pip install "ruff==0.14.0" "PyYAML==6.0.3"
      - name: Generate full qualification workflow
        shell: python
        run: |
          from pathlib import Path
          import yaml

          source = Path(".github/workflows/ci.yml").read_text(encoding="utf-8")
          body = source[source.index("env:\n") :]
          expression = lambda value: "${" + "{ " + value + " }}"
          header = "\n".join(
              [
                  "name: 🧪 Full validation and release",
                  "",
                  "on:",
                  "  push:",
                  "    branches:",
                  "      - master",
                  "    tags:",
                  "      - 'v[0-9]+.[0-9]+.[0-9]+'",
                  "  workflow_dispatch:",
                  "  schedule:",
                  "    - cron: '45 1 * * 3'",
                  "",
                  "permissions:",
                  "  contents: read",
                  "",
                  "concurrency:",
                  "  group: " + expression("github.workflow") + "-" + expression("github.ref"),
                  "  cancel-in-progress: "
                  + expression("!startsWith(github.ref, 'refs/tags/v')"),
                  "",
              ]
          )
          output = header + body
          pins = {
              "actions/checkout@v6": (
                  "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6"
              ),
              "actions/setup-python@v6": (
                  "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6"
              ),
              "actions/cache@v5": (
                  "actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5"
              ),
          }
          for old, new in pins.items():
              output = output.replace(old, new)
          write_jobs = (
              "upload-release",
              "update-notebooks-for-colab-and-binder",
              "deploy-doc",
          )
          for job in write_jobs:
              marker = f"  {job}:\n"
              replacement = marker + "    permissions:\n      contents: write\n"
              if marker not in output:
                  raise SystemExit(f"missing expected write job: {job}")
              output = output.replace(marker, replacement, 1)
          destination = Path("/tmp/full-ci.yml")
          destination.write_text(output, encoding="utf-8")
          yaml.safe_load(output)
          if "pull_request:" in output.split("env:\n", 1)[0]:
              raise SystemExit("full CI must not run on pull requests")
      - name: Apply repository Ruff hooks
        run: |
          ruff check --fix --select=I .
          ruff check --fix --select=F401 .
          ruff format .
      - name: Package exact refactor inputs
        run: |
          mkdir -p /tmp/ci-refactor
          cp /tmp/full-ci.yml /tmp/ci-refactor/full-ci.yml
          tar -czf /tmp/ci-refactor/formatted-cache-files.tar.gz \
            src/skdecide/_cache/coordinator.py \
            src/skdecide/_cache/domain.py \
            src/skdecide/_cache/enterprise.py \
            src/skdecide/_cache/governance.py \
            src/skdecide/_cache/keys.py \
            src/skdecide/_cache/observability.py \
            src/skdecide/_cache/provenance.py \
            src/skdecide/_cache/quarantine.py \
            src/skdecide/_cache/quotas.py \
            src/skdecide/_cache/rollout.py \
            src/skdecide/_cache/stores.py \
            src/skdecide/_cache/types.py \
            tests/test_caching.py \
            tests/test_enterprise_cache.py
      - uses: actions/upload-artifact@v4
        with:
          name: ci-refactor-inputs
          path: /tmp/ci-refactor
          if-no-files-found: error
          retention-days: 1
