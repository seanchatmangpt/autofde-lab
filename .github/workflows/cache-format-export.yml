name: Finalize CI refactor

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/cache-format-export.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: finalize-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install verifier dependencies
        run: |
          python -m pip install \
            "numpy==2.2.6" \
            "PyYAML==6.0.3" \
            "pytest==8.3.5" \
            "wrapt>=2.2.1,<3"
      - name: Download admitted refactor artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-refactor-inputs
          path: /tmp/ci-refactor
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31073335770
      - name: Materialize formatted source and full workflow
        run: |
          set -euo pipefail
          cp /tmp/ci-refactor/full-ci.yml .github/workflows/ci.yml
          tar -xzf /tmp/ci-refactor/formatted-cache-files.tar.gz -C .
      - name: Harden full qualification workflow
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path(".github/workflows/ci.yml")
          text = path.read_text(encoding="utf-8")
          pins = {
              "actions/upload-artifact@v7": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7",
              "actions/download-artifact@v8": "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8",
              "actions/github-script@v9": "actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9",
              "astral-sh/setup-uv@v8.0.0": "astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0",
              "conda-incubator/setup-miniconda@v3": "conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3",
              "hendrikmuhs/ccache-action@v1.2": "hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20",
              "jwlawson/actions-setup-cmake@v2": "jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2",
              "ncipollo/release-action@v1": "ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1",
              "pypa/gh-action-pypi-publish@release/v1": "pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1",
          }
          for old, new in pins.items():
              text = text.replace(old, new)

          old_apt = """      - name: Install needed apt dependencies
                  uses: awalsh128/cache-apt-pkgs-action@latest
                  with:
                    packages: libeccodes-dev
          """
          new_apt = """      - name: Install needed apt dependencies
                  run: |
                    sudo apt-get update
                    sudo apt-get install --yes libeccodes-dev
          """
          if old_apt not in text:
              raise SystemExit("mutable apt action block not found")
          text = text.replace(old_apt, new_apt, 1)
          text = re.sub(
              r"(?m)^(    runs-on: .+)$",
              r"\1\n    timeout-minutes: 120",
              text,
          )

          lines = text.splitlines()
          output = []
          index = 0
          while index < len(lines):
              line = lines[index]
              output.append(line)
              if re.search(r"uses: actions/checkout@[0-9a-f]{40}", line):
                  indent = line[: len(line) - len(line.lstrip())]
                  with_indent = indent + "  " if line.lstrip().startswith("- uses:") else indent
                  value_indent = with_indent + "  "
                  following = lines[index + 1] if index + 1 < len(lines) else ""
                  if following.startswith(with_indent + "with:"):
                      output.append(following)
                      index += 1
                      output.append(value_indent + "persist-credentials: false")
                  else:
                      output.append(with_indent + "with:")
                      output.append(value_indent + "persist-credentials: false")
              index += 1
          text = "\n".join(output) + "\n"

          marker = "\n  upload-release:\n"
          gate = """
            qualification-gate:
              name: Full qualification gate
              if: always()
              needs: [lint-sources, test-ubuntu, test-macos, test-windows, build-doc]
              runs-on: ubuntu-latest
              timeout-minutes: 5
              steps:
                - name: Require full qualification evidence
                  env:
                    LINT: ${{ needs.lint-sources.result }}
                    UBUNTU: ${{ needs.test-ubuntu.result }}
                    MACOS: ${{ needs.test-macos.result }}
                    WINDOWS: ${{ needs.test-windows.result }}
                    DOCS: ${{ needs.build-doc.result }}
                  shell: bash
                  run: |
                    set -euo pipefail
                    for result in "$LINT" "$UBUNTU" "$MACOS" "$WINDOWS" "$DOCS"; do
                      [[ "$result" == success ]] || {
                        echo "Full qualification dependency ended with: $result"
                        exit 1
                      }
                    done
          """
          if marker not in text:
              raise SystemExit("upload-release marker not found")
          text = text.replace(marker, "\n" + gate + marker, 1)
          path.write_text(text, encoding="utf-8")
      - name: Remove superseded workflows
        run: |
          rm -f .github/workflows/cache-enterprise.yml
          rm -f .github/workflows/cache-format-export.yml
      - name: Validate workflow and cache evidence
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          path = Path(".github/workflows/ci.yml")
          text = path.read_text(encoding="utf-8")
          data = yaml.load(text, Loader=yaml.BaseLoader)
          assert isinstance(data, dict) and "on" in data and "jobs" in data
          assert "pull_request:" not in text.split("permissions:", 1)[0]
          assert "qualification-gate:" in text
          assert text.count("contents: write") == 3
          assert "cache-apt-pkgs-action" not in text
          immutable = re.compile(r"^[^\s@]+@[0-9a-f]{40}(?:\s+#.*)?$")
          for number, line in enumerate(text.splitlines(), 1):
              stripped = line.strip()
              if stripped.startswith(("uses:", "- uses:")):
                  value = stripped.split("uses:", 1)[1].strip()
                  if not value.startswith("./"):
                      assert immutable.match(value), (number, value)
          PY
          python -m compileall -q \
            src/skdecide/_cache \
            src/skdecide/caching.py \
            tests/test_caching.py \
            tests/test_enterprise_cache.py
          python -m pytest -q tests/test_caching.py tests/test_enterprise_cache.py
      - name: Commit completed refactor
        shell: bash
        run: |
          set -euo pipefail
          test "$BRANCH" = "agent/80-20-capability-cache"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refactor CI into admission and qualification rails"
          git push origin "HEAD:$BRANCH"
