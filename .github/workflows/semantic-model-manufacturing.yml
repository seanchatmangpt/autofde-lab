name: Semantic model manufacturing court

on:
  pull_request:
    paths:
      - "src/autofde_lab/semantic_models/**"
      - "tests/semantic_models/**"
      - "ontology/semantic-model-manufacturing.ttl"
      - "ontology/shapes/semantic-model-manufacturing.shacl.ttl"
      - "examples/semantic_model_manufacturing.py"
      - "requirements-semantic-models.txt"
      - "requirements-semantic-training.txt"
      - ".github/workflows/semantic-model-manufacturing.yml"

permissions:
  contents: read

jobs:
  exact-head-court:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out literal pull-request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Assert exact revision
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          test "$observed" = "$expected"
          printf 'exact_head=%s\n' "$observed"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install bounded semantic-model stack
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-semantic-models.txt

      - name: Run deterministic semantic court
        shell: bash
        env:
          PYTHONPATH: src
        run: pytest tests/semantic_models/ -q

      - name: Execute no-network manufacture example
        shell: bash
        env:
          PYTHONPATH: src
        run: python examples/semantic_model_manufacturing.py
