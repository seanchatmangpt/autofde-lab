name: GymAct public dependency capsule

on:
  push:
    branches: [agent/gymact-validation-carrier]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manufacture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Build exact public wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          mkdir -p validation/gymact-wheelhouse
          python -m pip wheel --wheel-dir validation/gymact-wheelhouse \
            'anyio>=4.8,<5' \
            'blake3>=1.0,<2' \
            'fastapi>=0.139.2,<1' \
            'fastmcp>=3.4.1,<4' \
            'faststream>=0.7.2,<0.8' \
            'httpx>=0.28,<1' \
            'jsonschema>=4.23,<5' \
            'rfc3339-validator>=0.1.4,<1' \
            'pydantic>=2.13,<3' \
            'pyshacl>=0.40,<1' \
            'rdflib>=7.1,<8' \
            'rfc8785>=0.1.4,<1' \
            'typer>=0.27,<1' \
            'uvicorn>=0.48,<1' \
            'gymnasium>=1.0,<2' \
            'browsergym-core @ git+https://github.com/ServiceNow/BrowserGym.git@9e779f087de9a65668b6974d11f9ce9816026e96#subdirectory=browsergym/core' \
            'build>=1.2,<2' \
            'coverage[toml]>=7.6,<8' \
            'pytest>=8.3,<9' \
            'pytest-asyncio>=0.25,<2' \
            'ruff>=0.15,<1' \
            'twine>=6,<7' \
            'zensical>=0.0.51,<1' \
            'uv_build>=0.11.32,<0.12'
          sha256sum validation/gymact-wheelhouse/* | sort > validation/gymact-wheelhouse.sha256
      - name: Manufacture relocatable Python 3.12 runtime
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.12 --install-dir validation/uv-python --no-bin
          PY312=$(find validation/uv-python -type f -path '*/bin/python3.12' -print -quit)
          test -x "$PY312"
          "$PY312" --version
          echo "PY312=$PY312" >> "$GITHUB_ENV"
      - name: Install exact BrowserGym capsule and Chromium
        shell: bash
        run: |
          set -euo pipefail
          "$PY312" -m venv validation/browser-venv
          validation/browser-venv/bin/pip install --no-index --find-links validation/gymact-wheelhouse \
            'browsergym-core==0.14.3'
          PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/validation/ms-playwright" \
            validation/browser-venv/bin/playwright install chromium
          PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/validation/ms-playwright" \
            validation/browser-venv/bin/python - <<'PY'
          import browsergym.core
          import gymnasium
          from playwright.sync_api import sync_playwright
          from pathlib import Path

          assert browsergym.core.__version__ == '0.14.3'
          with sync_playwright() as pw:
              executable = Path(pw.chromium.executable_path)
              assert executable.is_file(), executable
              print('browsergym-core', browsergym.core.__version__)
              print('gymnasium', gymnasium.__version__)
              print('chromium', executable)
          PY
      - name: Record and pack capsule
        shell: bash
        run: |
          set -euo pipefail
          cat > validation/gymact-public-capsule.txt <<EOF
          browsergym_commit=9e779f087de9a65668b6974d11f9ce9816026e96
          browsergym_version=0.14.3
          python=3.12
          wheelhouse_sha256=validation/gymact-wheelhouse.sha256
          EOF
          du -sh validation/gymact-wheelhouse validation/ms-playwright validation/uv-python
          tar -czf validation/gymact-public-capsule.tar.gz \
            -C validation \
            gymact-wheelhouse \
            gymact-wheelhouse.sha256 \
            ms-playwright \
            uv-python \
            gymact-public-capsule.txt
          sha256sum validation/gymact-public-capsule.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: gymact-public-validation-capsule-${{ github.sha }}
          path: validation/gymact-public-capsule.tar.gz
          if-no-files-found: error
          retention-days: 1
