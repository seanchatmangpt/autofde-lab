name: Agentic Decision Fabric Crown

on:
  pull_request:
    paths:
      - "src/autofde_lab/fabric/**"
      - "tests/fabric/**"
      - "docs/agentic-fabric.md"
      - "requirements-agentic.txt"
      - ".github/workflows/agentic-fabric.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: agentic-fabric-${{ github.event.pull_request.number || github.ref }}-${{ matrix.python-version }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      # Python 3.10 removed 2026-09-17: the fabric surface imports
      # enum.StrEnum (3.11+ only) and the gymact install below is
      # marker-gated python_version >= '3.11', so the 3.10 leg always died
      # in pytest collection with 8 import errors (run 35128324191) and can
      # never pass. Restore only with a code-side 3.10 compatibility pass.
      matrix:
        python-version: ["3.12"]

    env:
      # Same Boost staging the ci.yml wheel job uses; the hub build needs it.
      BOOST_DIR: 3rdparty/boost
      BOOST_VERSION: "1.85.0"

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          # The compiled hub build (below) needs cpp/sdk/* (pybind11, nng, ...).
          submodules: recursive

      - name: Assert exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Build local Rust artifacts the fabric courts exercise
        run: |
          set -euo pipefail
          # 1) cmca_rank_cli: the vendored bcinr allocator CLI behind the
          #    fabric match path (vendor/bcinr ships in this checkout).
          (cd vendor/bcinr && cargo build --release --quiet)
          # 2) ocel_diff_cli: the platform-console capability-plan courts
          #    diff plan-step effects through the Rust example binary of the
          #    SAME pinned wasm4pm-compat commit the pip dependency uses.
          #    The suite resolves it at <repo-parent>/wasm4pm-compat.
          #    Anchor at wasm4pm-compat's pushed main tip (the example was
          #    added long after the python/ pip-pin commit).
          compat_dir="$(dirname "$GITHUB_WORKSPACE")/wasm4pm-compat"
          git clone --quiet https://github.com/seanchatmangpt/wasm4pm-compat.git "$compat_dir"
          git -C "$compat_dir" checkout --quiet c4fadd8e7d56a853632b740ff903ff6181150480
          (cd "$compat_dir" && cargo build --release --quiet --example ocel_diff_cli)

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-agentic.txt

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.9.2"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2
        with:
          cmake-version: "4.0.3"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: boost-cache
        with:
          path: ${{ env.BOOST_DIR }}
          key: boost-${{ env.BOOST_VERSION }}

      - name: Install Boost headers
        if: steps.boost-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$BOOST_DIR"
          curl --fail --silent --show-error --location \
            "https://archives.boost.io/release/$BOOST_VERSION/source/boost_${BOOST_VERSION//./_}.tar.bz2" \
            | tar jxf - -C "$BOOST_DIR" --strip-components=1 \
              "boost_${BOOST_VERSION//./_}/boost"

      - name: Install fabric runtime from the frozen lock
        shell: bash
        run: |
          set -euo pipefail
          # The fabric suite is no longer install-light: the tracked
          # ontology/autofde-lab-capabilities.ttl is the canonical
          # regeneration from a FULL environment (test_afde_2608 asserts
          # byte-identity against generate()'s live import-probe output),
          # and the cross-process courts load solvers through registered
          # entry points. Both require the project's own declared
          # dependency set, so use the exact recipe the ci.yml integration
          # job uses: export the frozen lock (extras + test group) and
          # install that. requirements-agentic.txt is installed on top for
          # the decision-fabric surfaces the focused list used to carry.
          uv export --frozen --format requirements-txt --extra all --group test \
            --no-dev --no-hashes --no-emit-project -o /tmp/autofde-lab-all.txt
          uv pip install --system -r /tmp/autofde-lab-all.txt \
            "ortools!=9.15.6755" "llvmlite>=0.45"
          uv pip install --system --no-deps \
            "wasm4pm-compat-pydantic @ git+https://github.com/seanchatmangpt/wasm4pm-compat.git@577e2d1d8bdfe27d96f61c63f3ea120994e8bfda#subdirectory=python" \
            "gymact @ git+https://github.com/seanchatmangpt/gymact.git@524d0bc8633d8534f500d67f27384ce9368c0863 ; python_version >= '3.11'"
          python -m pip install --disable-pip-version-check -r requirements-agentic.txt

      - name: Build compiled hub and materialize it into the src tree
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          set -euo pipefail
          # tests/fabric's Chicago courts spawn real subprocesses
          # (autofde_lab-classical-engine via fabric.pddl_engine, ...) that
          # import the compiled scikit-decide hub extension. This court runs
          # pytest with PYTHONPATH=src at the exact candidate head, so the
          # extension must exist inside the src tree -- no wheel is installed
          # here. Build it from the exact candidate (same scikit-build-core
          # path as the ci.yml wheel job) and copy the produced modules into
          # src/autofde_lab/hub where the shadowed import expects them.
          python -m pip install --disable-pip-version-check "build==1.2.2"
          export Boost_ROOT="$GITHUB_WORKSPACE/$BOOST_DIR"
          python -m build --wheel
          python - <<'PY'
          import glob
          import pathlib
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel was produced by python -m build"
          dest = pathlib.Path("src/autofde_lab/hub")
          copied = 0
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as zf:
                  for name in zf.namelist():
                      if name.startswith("autofde_lab/hub/") and name.endswith(".so"):
                          target = dest / pathlib.PurePosixPath(name).name
                          target.write_bytes(zf.read(name))
                          copied += 1
                          print(f"materialized {name} -> {target}")
          assert copied >= 1, "compiled hub module missing from the built wheel"
          PY
          # Register the project's entry points (autofde_lab.solvers etc.):
          # load_registered_solver resolves Astar through
          # importlib.metadata, which only sees an INSTALLED distribution.
          # The cross-process determinism courts spawn the classical-engine
          # subprocess that loads Astar this way; without the install the
          # solver group is empty ('NoneType' object is not callable).
          python -m pip install --no-deps --disable-pip-version-check dist/*.whl

      - name: Compile authored fabric surfaces
        run: |
          python -m compileall -q src/autofde_lab/fabric tests/fabric

      - name: Execute cache, service, CLI, MCP, A2A, and DSPy tests
        env:
          PYTHONPATH: src
          SKDECIDE_FABRIC_CACHE: /tmp/scikit-decide-fabric.sqlite3
        run: python -m pytest -q -c /dev/null tests/fabric

      - name: Verify CLI and real protocol construction
        env:
          PYTHONPATH: src
          SKDECIDE_FABRIC_CACHE: /tmp/scikit-decide-fabric-smoke.sqlite3
        run: |
          python -m autofde_lab.fabric --help | grep -q solve
          python - <<'PY'
          from autofde_lab.fabric.a2a import create_app
          from autofde_lab.fabric.dspy import DSPyDecisionCompiler
          from autofde_lab.fabric.mcp import create_server

          assert create_server() is not None
          assert create_app(url="http://127.0.0.1:9999") is not None
          assert DSPyDecisionCompiler() is not None
          PY

      - name: Emit bounded crown standing
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          print(json.dumps({
              "schema": "skdecide.agentic-fabric-crown/1",
              "head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "python": os.environ.get("pythonLocation"),
              "claim_ceiling": "REGISTERED_DOMAIN_SOLVER_MATCH_AND_BOUNDED_ROLLOUT_ONLY",
          }, sort_keys=True))
          PY
