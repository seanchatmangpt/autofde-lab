name: Bootstrap ForwardBench gyms

on:
  push:
    branches: [agent/add-forwardbench-gyms]
    paths: [.github/workflows/bootstrap-forwardbench-gyms.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ggen-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6

      - name: Construct canonical RDF and current ggen contracts
        run: |
          set -euo pipefail
          uv run --no-project --with rdflib python docs/papers/bootstrap_papers_ttl.py

          cat > docs/papers/queries/gate-required-fields.rq <<'RQ'
          # MESSAGE: ForwardBench benchmark is missing a required executable field
          PREFIX afb: <https://github.com/seanchatmangpt/autofde-lab/ns/forwardbench#>
          PREFIX dct: <http://purl.org/dc/terms/>
          SELECT ?b WHERE {
            ?b a afb:Benchmark .
            FILTER(
              NOT EXISTS { ?b afb:slug ?slug } ||
              NOT EXISTS { ?b dct:title ?title } ||
              NOT EXISTS { ?b afb:adapterFamily ?adapter } ||
              NOT EXISTS { ?b afb:sourceStanding ?standing }
            )
          }
          ORDER BY ?b
          RQ

          cat > docs/papers/queries/vendors.rq <<'RQ'
          PREFIX afb: <https://github.com/seanchatmangpt/autofde-lab/ns/forwardbench#>
          SELECT ?slug ?repo ?path ?requested_ref ?adapter ?smoke ?local_safe ?requires_authority
                 ?pinned_revision ?resolution_standing ?smoke_standing
          WHERE {
            ?v a afb:VendorProject ; afb:slug ?slug ; afb:repositoryUrl ?repo ;
               afb:vendorPath ?path ; afb:requestedRef ?requested_ref ;
               afb:adapterFamily ?adapter ; afb:smokeProfile ?smoke ;
               afb:localSafe ?local_safe ; afb:requiresAuthority ?requires_authority .
            OPTIONAL { ?v afb:pinnedRevision ?pinned_revision . }
            OPTIONAL { ?v afb:resolutionStanding ?resolution_standing . }
            OPTIONAL { ?v afb:smokeStanding ?smoke_standing . }
          }
          ORDER BY ?slug
          RQ

          cat > docs/papers/queries/benchmarks.rq <<'RQ'
          PREFIX afb: <https://github.com/seanchatmangpt/autofde-lab/ns/forwardbench#>
          PREFIX dct: <http://purl.org/dc/terms/>
          SELECT ?slug ?title ?adapter ?source_standing ?local_safe ?requires_authority
                 ?vendor_slug ?repo ?path ?pinned_revision ?resolution_standing ?smoke_standing
          WHERE {
            ?b a afb:Benchmark ; afb:slug ?slug ; dct:title ?title ;
               afb:adapterFamily ?adapter ; afb:sourceStanding ?source_standing ;
               afb:localSafe ?local_safe ; afb:requiresAuthority ?requires_authority .
            OPTIONAL {
              ?b afb:vendorProject ?v .
              ?v afb:slug ?vendor_slug ; afb:repositoryUrl ?repo ; afb:vendorPath ?path .
              OPTIONAL { ?v afb:pinnedRevision ?pinned_revision . }
              OPTIONAL { ?v afb:resolutionStanding ?resolution_standing . }
              OPTIONAL { ?v afb:smokeStanding ?smoke_standing . }
            }
          }
          ORDER BY ?slug
          RQ

          cat > docs/papers/queries/papers.rq <<'RQ'
          PREFIX afb: <https://github.com/seanchatmangpt/autofde-lab/ns/forwardbench#>
          PREFIX dct: <http://purl.org/dc/terms/>
          PREFIX fabio: <http://purl.org/spar/fabio/>
          SELECT ?id ?title ?retrieval ?sha256
          WHERE {
            ?p a fabio:ResearchPaper ; afb:arxivId ?id ; dct:title ?title ; afb:retrievalStanding ?retrieval .
            OPTIONAL { ?p afb:sha256 ?sha256 . }
          }
          ORDER BY ?id
          RQ

          cat > docs/papers/templates/vendors.tsv.tera <<'TERA'
          # slug	repository	path	requested_ref	adapter	smoke	local_safe	requires_authority	pin	resolution	smoke_standing
          {%- for row in sparql_results %}
          {{ row["slug"] }}	{{ row["repo"] }}	{{ row["path"] }}	{{ row["requested_ref"] }}	{{ row["adapter"] }}	{{ row["smoke"] }}	{{ row["local_safe"] }}	{{ row["requires_authority"] }}	{{ row["pinned_revision"] | default(value="") }}	{{ row["resolution_standing"] | default(value="UNRESOLVED") }}	{{ row["smoke_standing"] | default(value="NOT_RUN") }}
          {%- endfor %}
          TERA

          cat > docs/papers/templates/registry.json.tera <<'TERA'
          {"schema_version":1,"authority":"SELECT_ONLY","benchmarks":[{%- for row in sparql_results %}{"slug":{{ row["slug"] | json_encode() }},"title":{{ row["title"] | json_encode() }},"adapter":{{ row["adapter"] | json_encode() }},"source_standing":{{ row["source_standing"] | json_encode() }},"vendor_slug":{{ row["vendor_slug"] | default(value="") | json_encode() }},"repository":{{ row["repo"] | default(value="") | json_encode() }},"path":{{ row["path"] | default(value="") | json_encode() }},"pinned_revision":{{ row["pinned_revision"] | default(value="") | json_encode() }},"resolution_standing":{{ row["resolution_standing"] | default(value="UNRESOLVED") | json_encode() }},"smoke_standing":{{ row["smoke_standing"] | default(value="NOT_RUN") | json_encode() }},"local_safe":{% if row["local_safe"] == "true" %}true{% else %}false{% endif %},"requires_authority":{% if row["requires_authority"] == "true" %}true{% else %}false{% endif %}}{% if not loop.last %},{% endif %}{%- endfor %}]}
          TERA

          cat > docs/papers/templates/papers.json.tera <<'TERA'
          {"schema_version":1,"papers":[{%- for row in sparql_results %}{"arxiv_id":{{ row["id"] | json_encode() }},"title":{{ row["title"] | json_encode() }},"retrieval_standing":{{ row["retrieval"] | json_encode() }},"sha256":{{ row["sha256"] | default(value="") | json_encode() }}}{% if not loop.last %},{% endif %}{%- endfor %}]}
          TERA

          python - <<'PY'
          import re
          from pathlib import Path
          cfg=Path('docs/papers/ggen.toml')
          s=cfg.read_text().replace('[validation]\nshacl = ["ontology/papers-shapes.ttl"]\nstrict_mode = true','[validation]\ngates = ["queries/gate-required-fields.rq"]\nstrict_mode = true')
          # ggen v26.8.6 release parses output_dir but does not apply it. Make
          # destinations explicit so this project is identical on 26.8.6 and
          # on later builds where output_dir is implemented.
          s=s.replace('output_dir = "generated/forwardbench/"','output_dir = "."')
          s=re.sub(r'output_file = "(?!generated/forwardbench/)([^"]+)"',r'output_file = "generated/forwardbench/\1"',s)
          cfg.write_text(s)
          defaults={'pinned_revision':'','resolution_standing':'UNRESOLVED','smoke_standing':'NOT_RUN','vendor_slug':'','repo':'','path':'','sha256':''}
          for path in Path('docs/papers/templates').glob('*.tera'):
              text=path.read_text()
              for key,value in defaults.items():
                  text=text.replace(f'row.{key}',f'row["{key}"] | default(value="{value}")')
              path.write_text(text)
          PY

      - name: Install pinned ggen v26.8.6
        run: |
          set -euo pipefail
          d="$(mktemp -d)"; cd "$d"
          base=https://github.com/seanchatmangpt/ggen/releases/download/v26.8.6
          curl -fsSL --retry 3 -O "$base/ggen-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -O "$base/ggen-x86_64-unknown-linux-gnu.tar.gz.sha256"
          sha256sum -c ggen-x86_64-unknown-linux-gnu.tar.gz.sha256
          mkdir x; tar -xzf ggen-x86_64-unknown-linux-gnu.tar.gz -C x
          bin="$(find x -type f -name ggen -perm -111 | head -1)"; test -n "$bin"
          sudo install -m0755 "$bin" /usr/local/bin/ggen
          ggen --version

      - name: ggen Gall checkpoint
        run: |
          set -euo pipefail
          (cd docs/papers && ggen sync run)
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('docs/papers/generated/forwardbench')
          b=json.loads((root/'registry.json').read_text())['benchmarks']
          p=json.loads((root/'papers.json').read_text())['papers']
          vendors=[x for x in (root/'vendors.tsv').read_text().splitlines() if x and not x.startswith('#')]
          assert len(b)==80, len(b)
          assert len(p)==52, len(p)
          assert len(vendors)==52, len(vendors)
          assert len({x['slug'] for x in b})==80
          print(f'GGEN_GALL_ALIVE benchmarks={len(b)} papers={len(p)} vendors={len(vendors)}')
          PY
