name: Bootstrap ForwardBench gyms

on:
  push:
    branches: [agent/add-forwardbench-gyms]
    paths: [.github/workflows/bootstrap-forwardbench-gyms.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forwardbench-gym-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Build canonical RDF source
        run: |
          set -euo pipefail
          uv run --no-project --with rdflib python docs/papers/bootstrap_papers_ttl.py

      - name: Install pinned ggen v26.8.6
        run: |
          set -euo pipefail
          d="$(mktemp -d)"; cd "$d"
          base=https://github.com/seanchatmangpt/ggen/releases/download/v26.8.6
          curl -fsSL --retry 3 -O "$base/ggen-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -O "$base/ggen-x86_64-unknown-linux-gnu.tar.gz.sha256"
          sha256sum -c ggen-x86_64-unknown-linux-gnu.tar.gz.sha256
          mkdir x; tar -xzf ggen-x86_64-unknown-linux-gnu.tar.gz -C x
          bin="$(find x -type f -name ggen -perm -111 | head -1)"; test -n "$bin"
          sudo install -m0755 "$bin" /usr/local/bin/ggen
          ggen --version

      - name: Manufacture registry from papers.ttl
        run: |
          set -euo pipefail
          (cd docs/papers && ggen sync run)
          chmod +x docs/papers/generated/forwardbench/*.sh
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('docs/papers/generated/forwardbench')
          b=json.loads((root/'registry.json').read_text())['benchmarks']
          p=json.loads((root/'papers.json').read_text())['papers']
          assert len(b)>=60 and len(p)>=50
          print('GGEN_ALIVE',len(b),len(p))
          PY

      - name: Resolve official repositories to lazy gitlinks
        id: pins
        run: |
          set -euo pipefail
          : > /tmp/unresolved
          cat > docs/papers/gym-lock.ttl <<'TTL'
          @prefix afb: <https://github.com/seanchatmangpt/autofde-lab/ns/forwardbench#> .
          TTL
          resolved=0
          while IFS=$'\t' read -r slug repo path ref adapter smoke local_safe authority old_pin old_resolution old_smoke; do
            [[ -n "${slug:-}" && "$slug" != \#* ]] || continue
            sha="$(git ls-remote "$repo" HEAD | awk 'NR==1{print $1}' || true)"
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              printf '%s\t%s\n' "$slug" "$repo" >> /tmp/unresolved
              printf '<https://github.com/seanchatmangpt/autofde-lab/data/forwardbench/vendor-%s> afb:resolutionStanding "REFUSED:REPOSITORY_UNRESOLVED" .\n' "$slug" >> docs/papers/gym-lock.ttl
              continue
            fi
            name="forwardbench-$slug"
            git config -f .gitmodules --remove-section "submodule.$name" 2>/dev/null || true
            git config -f .gitmodules "submodule.$name.path" "$path"
            git config -f .gitmodules "submodule.$name.url" "$repo"
            git config -f .gitmodules "submodule.$name.update" none
            git update-index --add --cacheinfo "160000,$sha,$path"
            printf '<https://github.com/seanchatmangpt/autofde-lab/data/forwardbench/vendor-%s> afb:pinnedRevision "%s" ; afb:resolutionStanding "PINNED" .\n' "$slug" "$sha" >> docs/papers/gym-lock.ttl
            resolved=$((resolved+1))
          done < docs/papers/generated/forwardbench/vendors.tsv
          echo "resolved=$resolved" >> "$GITHUB_OUTPUT"
          echo "unresolved=$(wc -l < /tmp/unresolved | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cat /tmp/unresolved || true

      - name: Fetch and hash every declared paper
        id: papers
        run: |
          set -euo pipefail
          mkdir -p docs/papers/pdf
          cat > docs/papers/paper-lock.ttl <<'TTL'
          @prefix afb: <https://github.com/seanchatmangpt/autofde-lab/ns/forwardbench#> .
          TTL
          count=0
          while IFS= read -r id; do
            [[ -n "$id" ]] || continue
            dst="docs/papers/pdf/$id.pdf"
            if [[ ! -f "$dst" || "$(head -c5 "$dst" || true)" != "%PDF-" ]]; then
              ok=0
              for url in "https://arxiv.org/pdf/$id" "https://export.arxiv.org/pdf/$id"; do
                if curl -fsSL --retry 3 --max-time 120 -o "$dst.tmp" "$url" && [[ "$(head -c5 "$dst.tmp")" == "%PDF-" ]]; then mv "$dst.tmp" "$dst"; ok=1; break; fi
                rm -f "$dst.tmp"
              done
              [[ $ok -eq 1 ]] || { echo "REFUSED:PAPER_FETCH_FAILED:$id"; exit 1; }
            fi
            hash="$(sha256sum "$dst"|awk '{print $1}')"; iri="${id//./-}"
            printf '<https://github.com/seanchatmangpt/autofde-lab/data/forwardbench/paper-%s> afb:sha256 "%s" ; afb:resolutionStanding "PDF_FETCHED_SHA256_VERIFIED|NOT_REPRODUCED" .\n' "$iri" "$hash" >> docs/papers/paper-lock.ttl
            count=$((count+1))
          done < docs/papers/generated/forwardbench/paper-ids.txt
          (cd docs/papers/pdf && sha256sum ./*.pdf | sort > SHA256SUMS && sha256sum -c SHA256SUMS)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Reproject exact locks
        run: |
          set -euo pipefail
          (cd docs/papers && ggen sync run)
          chmod +x docs/papers/generated/forwardbench/*.sh

      - name: Execute CUBE canonical scenario
        run: |
          set -euo pipefail
          git -c submodule.forwardbench-cube-standard.update=checkout submodule update --init --depth 1 -- vendor/gyms/cube-standard
          bash docs/papers/generated/forwardbench/probe-gyms.sh cube-standard
          pushd vendor/gyms/cube-standard/examples/counter-cube
          uv sync
          uv run pytest tests -q
          uv run python - <<'PY'
          from counter_cube import CounterBenchmark
          from cube.core import Action
          b=CounterBenchmark(); b.setup(); n=0
          for cfg in b.get_task_configs():
              t=cfg.make(); t.reset()
              while True:
                  o=t.step(Action(name='increment',arguments={}))
                  if o.done: assert o.reward==1.0; n+=1; break
              t.close()
          b.close(); assert n>0; print('CUBE_SCENARIO_RUNS',n)
          PY
          popd

      - name: Bootstrap Harbor and BrowserGym
        run: |
          set -euo pipefail
          git -c submodule.forwardbench-harbor.update=checkout submodule update --init --depth 1 -- vendor/gyms/harbor
          bash docs/papers/generated/forwardbench/probe-gyms.sh harbor
          uvx --from ./vendor/gyms/harbor harbor datasets list | tee /tmp/harbor.txt
          test -s /tmp/harbor.txt
          git -c submodule.forwardbench-browsergym.update=checkout submodule update --init --depth 1 -- vendor/gyms/browsergym
          bash docs/papers/generated/forwardbench/probe-gyms.sh browsergym
          uv venv /tmp/bg --python 3.12
          uv pip install --python /tmp/bg/bin/python -e vendor/gyms/browsergym/browsergym/core
          /tmp/bg/bin/python - <<'PY'
          import browsergym.core, gymnasium as gym
          xs=[x for x in gym.envs.registry if x.startswith('browsergym/')]
          assert xs; print('BROWSERGYM_BOOTSTRAPS',len(xs))
          PY

      - name: Record observed smoke standing and validate AutoFDE adapter
        run: |
          set -euo pipefail
          cat > docs/papers/smoke-lock.ttl <<'TTL'
          @prefix afb: <https://github.com/seanchatmangpt/autofde-lab/ns/forwardbench#> .
          <https://github.com/seanchatmangpt/autofde-lab/data/forwardbench/vendor-cube-standard> afb:smokeStanding "SCENARIO_RUNS" .
          <https://github.com/seanchatmangpt/autofde-lab/data/forwardbench/vendor-harbor> afb:smokeStanding "BOOTSTRAPS" .
          <https://github.com/seanchatmangpt/autofde-lab/data/forwardbench/vendor-browsergym> afb:smokeStanding "BOOTSTRAPS" .
          TTL
          (cd docs/papers && ggen sync run)
          chmod +x docs/papers/generated/forwardbench/*.sh
          uvx --from pytest pytest tests/forwardbench/test_registry.py -q
          python scripts/forwardbench.py --registry docs/papers/generated/forwardbench/registry.json plan cube > /tmp/plan.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/plan.json'))
          assert p['status']=='CANDIDATE' and p['reason']=='SELECT_ONLY:NO_ACTUATION'
          PY

      - name: Validate lazy vendor topology and emit receipt
        env:
          RESOLVED: ${{ steps.pins.outputs.resolved }}
          UNRESOLVED: ${{ steps.pins.outputs.unresolved }}
          PAPERS: ${{ steps.papers.outputs.count }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import configparser,json,os,subprocess,hashlib
          from pathlib import Path
          stage=subprocess.check_output(['git','ls-files','--stage','vendor/gyms'],text=True).splitlines()
          links=[x for x in stage if x.startswith('160000 ')]
          assert len(links)==int(os.environ['RESOLVED'])
          c=configparser.ConfigParser(); c.read('.gitmodules')
          ss=[s for s in c.sections() if s.startswith('submodule "forwardbench-')]
          assert len(ss)==len(links)
          assert all(c[s].get('update')=='none' for s in ss)
          reg=json.loads(Path('docs/papers/generated/forwardbench/registry.json').read_text())
          rec={'schema_version':1,'standing':'PARTIAL_ALIVE','benchmarks':len(reg['benchmarks']),'repository_pins':len(links),'repository_resolution_failures':int(os.environ['UNRESOLVED']),'papers':int(os.environ['PAPERS']),'ggen_release':'v26.8.6','smoke':{'cube-standard':'SCENARIO_RUNS','harbor':'BOOTSTRAPS','browsergym':'BOOTSTRAPS'},'authority':'SELECT_ONLY; no live cloud gym deployed'}
          rec['sha256']=hashlib.sha256(json.dumps(rec,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path('docs/papers/generated/forwardbench/BOOTSTRAP_RECEIPT.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          print(json.dumps(rec,indent=2))
          PY

      - name: Commit exact graph, gitlinks, projections, and evidence
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f docs/papers/bootstrap-source.json docs/papers/bootstrap_papers_ttl.py
          git add -A .gitmodules docs/papers src/autofde_lab/forwardbench scripts/forwardbench.py tests/forwardbench vendor/gyms
          git commit -m "feat(forwardbench): pin executable gym corpus and ggen projections"
          git push origin "HEAD:${GITHUB_REF_NAME}"
