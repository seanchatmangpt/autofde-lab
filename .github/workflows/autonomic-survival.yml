name: Autonomic survival exact head

on:
  pull_request:
    branches: [master]
    paths:
      - "src/autofde_lab/iec/crowns/survival.py"
      - "src/autofde_lab/iec/crowns/recurrent_survival.py"
      - "tests/iec/test_survival_benchmark.py"
      - "tests/iec/test_recurrent_survival_benchmark.py"
      - "docs/2026-09-25-premature-actuation-survival.md"
      - ".github/workflows/autonomic-survival.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survival-court:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'autonomic_survival_exact_head=%s\n' "$actual"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install focused court dependency
        run: python -m pip install "pytest==8.3.5"

      - name: Compile survival court
        env:
          PYTHONPATH: src
        run: >-
          python -m compileall -q
          src/autofde_lab/iec/crowns/survival.py
          src/autofde_lab/iec/crowns/recurrent_survival.py
          tests/iec/test_survival_benchmark.py
          tests/iec/test_recurrent_survival_benchmark.py

      - name: Execute survival falsifiers
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q
          tests/iec/test_survival_benchmark.py
          tests/iec/test_recurrent_survival_benchmark.py
