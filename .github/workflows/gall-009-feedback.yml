name: GALL-009 Feedback Admission Court

on:
  pull_request:
    branches:
      - gall/v26.9.18-final-specs
    paths:
      - "src/autofde_lab/sa2a/autonomics/feedback.py"
      - "src/autofde_lab/sa2a/autonomics/__init__.py"
      - "tests/sa2a/test_gall_autonomics.py"
      - ".github/workflows/gall-009-feedback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-subject:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest==8.3.5"
      - name: Compile exact authored surface
        run: python -m compileall -q src
      - name: Execute exact court
        env:
          PYTHONPATH: src
        run: python -m pytest -q -c /dev/null tests/sa2a/test_gall_autonomics.py -k gall_009
