name: Enterprise cache qualification

on:
  pull_request:
    paths:
      - "src/skdecide/_cache/**"
      - "src/skdecide/caching.py"
      - "tests/test_caching.py"
      - "tests/test_enterprise_cache.py"
      - ".github/workflows/cache-enterprise.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-cache-verifier:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared runtime and test dependencies
        run: >-
          python -m pip install
          pytest numpy
          "wrapt>=2.2.1"
          "pynng>=0.6.2"
          "pathos>=0.2.7"
          "discrete-optimization>=0.9.0"
      - name: Compile cache sources
        run: python -m compileall -q src/skdecide/_cache src/skdecide/caching.py
      - name: Run focused cache verifier
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest
          tests/test_caching.py
          tests/test_enterprise_cache.py
          -q
