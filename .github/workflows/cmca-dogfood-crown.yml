name: CMCA Dogfood Crown

on:
  pull_request:
    paths:
      - "src/autofde_lab/cmca/**"
      - "src/autofde_lab/planning/**"
      - "src/autofde_lab/agent/**"
      - "src/autofde_lab/beam/**"
      - "src/autofde_lab/ocel/**"
      - "src/autofde_lab/sa2a/unknown/**"
      - "tests/agent/**"
      - "tests/planning/**"
      - "tests/benchmarks/test_cmca_eight_use_cases_benchmark.py"
      - "scripts/run_cmca_dogfood_crown.py"
      - ".github/workflows/cmca-dogfood-crown.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crown:
    name: eight-use-case two-episode crown
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      CROWN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact subject identity
        run: |
          test "$(git rev-parse HEAD)" = "$CROWN_HEAD_SHA"
          echo "exact_head=$CROWN_HEAD_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture hosted toolchain identity
        run: |
          echo "CROWN_UV_VERSION=$(uv --version)" >> "$GITHUB_ENV"

      - name: Install Python court dependencies without native project build
        run: |
          uv sync --no-install-project --extra bcinr-wasm

      - name: Planning-probe, SA2A advice, and dogfood Chicago tests
        run: |
          uv run --no-sync pytest -q \
            tests/planning/test_cmca_planning_probe.py \
            tests/planning/test_sa2a_advice.py \
            tests/agent/test_cmca_dogfood_crown.py

      - name: Existing eight-use-case CMCA benchmark
        run: |
          uv run --no-sync pytest -q \
            tests/benchmarks/test_cmca_eight_use_cases_benchmark.py

      - name: Run Fortune-5 demo crown
        run: |
          uv run --no-sync python scripts/run_cmca_dogfood_crown.py \
            --json-out artifacts/cmca-dogfood-crown.json

      - name: Verify hosted receipt identity and digest
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path("artifacts/cmca-dogfood-crown.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          claimed = payload.pop("artifact_receipt_hash")
          expected = hashlib.sha256(
              json.dumps(payload, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).hexdigest()
          identity = payload["subject_identity"]

          assert claimed == expected
          assert identity["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert identity["head_sha"] == os.environ["CROWN_HEAD_SHA"]
          assert identity["workflow_run_id"] == os.environ["GITHUB_RUN_ID"]
          assert identity["workflow_run_attempt"] == os.environ["GITHUB_RUN_ATTEMPT"]
          assert identity["runner_os"] == os.environ["RUNNER_OS"]
          assert identity["runner_arch"] == os.environ["RUNNER_ARCH"]
          assert identity["uv_version"] == os.environ["CROWN_UV_VERSION"]
          print(f"artifact_receipt_hash={claimed}")
          PY

      - name: Upload crown receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cmca-dogfood-crown-receipt
          path: artifacts/cmca-dogfood-crown.json
          if-no-files-found: error
