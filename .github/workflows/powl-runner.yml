name: ⚡ POWL V2 concurrent runner

on:
  pull_request:
    branches: [master]
    paths:
      - "src/autofde_lab/powl/**"
      - "tests/powl/**"
      - ".github/workflows/powl-runner.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powl-v2-runner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-court:
    name: POWL V2 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install bounded runner court
        run: |
          python -m pip install \
            "pytest==8.3.5" \
            "wrapt>=2.2.1,<3" \
            "pynng>=0.6.2" \
            "pathos>=0.2.7" \
            "discrete-optimization>=0.9.0"

      - name: Reject mockist concurrency proof
        shell: bash
        run: |
          set -euo pipefail
          ! grep -En \
            'unittest\.mock|Mock\(|MagicMock|patch\(|monkeypatch' \
            tests/powl/test_runner.py

      - name: Execute real concurrent runner court
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/powl/test_runner.py
