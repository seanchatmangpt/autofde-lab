name: mmdio Planning Export Crown

on:
  pull_request:
    paths:
      - "src/autofde_lab/interchange/**"
      - "tests/interchange/test_mmdio_planning.py"
      - "docs/mmdio-planning-export.md"
      - ".github/workflows/mmdio-planning-export-crown.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmdio-planning-export-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact AutoFDE candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install focused test capsule
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Compile exporter and execute focused laws
        run: |
          python -m compileall -q src/autofde_lab/interchange tests/interchange/test_mmdio_planning.py
          python -m pytest -q -c /dev/null tests/interchange/test_mmdio_planning.py

      - name: Manufacture five formalism exports
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          import sys

          path = Path("tests/interchange/test_mmdio_planning.py")
          spec = importlib.util.spec_from_file_location("afl_mmdio_crown_fixtures", path)
          assert spec is not None and spec.loader is not None
          fixtures = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = fixtures
          spec.loader.exec_module(fixtures)
          m = fixtures.m

          out = Path("/tmp/autofde-mmdio")
          out.mkdir(parents=True, exist_ok=True)
          exports = {
              "pddl": m.export_pddl_domain(
                  fixtures.DeterministicDomain(), subject="enterprise-pddl"
              ),
              "ppddl": m.export_ppddl_domain(
                  fixtures.ProbabilisticDomain(), subject="enterprise-ppddl"
              ),
              "pddl+": m.export_tpddl_domain(
                  fixtures.TemporalDomain(), subject="enterprise-pddl-plus"
              ),
              "rddl": m.export_rddl_rollout(
                  fixtures.RDDLDomain(), [1, 2, 3], subject="enterprise-rddl"
              ),
              "powl-2.0": m.export_powl(
                  fixtures.PartialOrder(
                      (
                          fixtures.Atom("rights"),
                          fixtures.Atom("marketing"),
                          fixtures.Atom("release"),
                      ),
                      {fixtures.OrderEdge(0, 2)},
                  ),
                  subject="enterprise-powl",
              ),
          }
          for formalism, export in exports.items():
              export.write_json(out / f"{formalism.replace('+', 'plus')}.json")
          print(json.dumps({
              "schema": m.SCHEMA,
              "formalisms": sorted(exports),
              "count": len(exports),
              "claim": m.CLAIM_CEILING,
          }, sort_keys=True))
          PY

      - name: Check out exact mmdio planning contract
        uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/mmdio
          ref: b175b4cf07216a8a8a33afc1d3542c21fd0ba4b2
          path: _oracle/mmdio
          fetch-depth: 1

      - name: Admit exports through real mmdio and manufacture docs + receipts
        env:
          PYTHONPATH: _oracle/mmdio/src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from mmdio.planning.jsonio import load_planning_graph
          from mmdio.planning.projections import generate_planning_documents
          from mmdio.planning.receipts import receipt_for, verify_receipt

          source = Path("/tmp/autofde-mmdio")
          docs_root = Path("/tmp/autofde-mmdio-docs")
          docs_root.mkdir(parents=True, exist_ok=True)
          admitted = []
          diagrams = 0
          receipts = 0
          for path in sorted(source.glob("*.json")):
              graph = load_planning_graph(path)
              documents = generate_planning_documents(graph)
              assert documents, f"no planning documents for {path}"
              admitted.append(graph.formalism)
              target = docs_root / graph.formalism.replace("+", "plus")
              target.mkdir(parents=True, exist_ok=True)
              for document in documents:
                  receipt = receipt_for(graph, document)
                  verify_receipt(graph, document, receipt)
                  (target / f"{document.name}.{document.diagram_type}.mmd").write_text(
                      document.content, encoding="utf-8"
                  )
                  diagrams += 1
                  receipts += 1
          assert set(admitted) == {"pddl", "ppddl", "pddl+", "rddl", "powl-2.0"}
          assert receipts == diagrams
          print(json.dumps({
              "schema": "autofde.mmdio-cross-repo-crown/1",
              "mmdio_head": "b175b4cf07216a8a8a33afc1d3542c21fd0ba4b2",
              "formalisms": sorted(admitted),
              "diagrams": diagrams,
              "receipts_verified": receipts,
              "claim": "NATIVE_PLANNING_SEMANTICS_TO_MMDIO_PROJECTION_ONLY",
          }, sort_keys=True))
          PY

      - name: Install pinned Mermaid oracle
        working-directory: _oracle/mmdio/tests/oracle
        run: npm ci

      - name: Parse every generated planning document with Mermaid 11.16.0
        run: |
          mapfile -t diagrams < <(find /tmp/autofde-mmdio-docs -name '*.mmd' -print | sort)
          test "${#diagrams[@]}" -gt 0
          node _oracle/mmdio/tests/oracle/planning_oracle.mjs "${diagrams[@]}"
