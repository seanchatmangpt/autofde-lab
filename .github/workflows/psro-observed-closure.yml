name: PSRO observed-closure qualification

on:
  pull_request:
    branches: [master]
    paths:
      - "src/autofde_lab/reasoning/cross_play_schedule_psro.py"
      - "tests/reasoning/test_cross_play_schedule_psro_chicago.py"
      - ".github/workflows/psro-observed-closure.yml"

permissions:
  contents: read

jobs:
  observed-closure:
    name: Exact-head PSRO observed-closure court
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$expected" ]] || {
            echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=$actual expected=$expected"
            exit 2
          }
          printf 'exact_head=%s\n' "$actual"

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.9.2"
          python-version: "3.13"
          enable-cache: true

      - name: Install repository validation capsule
        run: uv sync --extra=all

      - name: Reject mockist seams in the owning court
        shell: bash
        run: |
          ! grep -nE 'unittest\.mock|\bMock\(|\bMagicMock\(|\bpatch\(|monkeypatch' \
            tests/reasoning/test_cross_play_schedule_psro_chicago.py

      - name: Execute real cross-play PSRO strategy court
        run: >-
          .venv/bin/python -m pytest
          tests/reasoning/test_cross_play_schedule_psro_chicago.py
          -v
