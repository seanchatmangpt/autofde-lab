name: Premature actuation survival exact head

on:
  pull_request:
    branches: [master]
    paths:
      - "src/autofde_lab/iec/crowns/survival.py"
      - "src/autofde_lab/iec/crowns/survival_compare.py"
      - "src/autofde_lab/iec/crowns/survival_recurrence.py"
      - "src/autofde_lab/iec/crowns/survival_ocel.py"
      - "src/autofde_lab/iec/crowns/survival_bundle.py"
      - "src/autofde_lab/iec/crowns/survival_uncertainty.py"
      - "src/autofde_lab/iec/crowns/survival_guard.py"
      - "tests/iec/test_survival_benchmark.py"
      - "tests/iec/test_survival_compare.py"
      - "tests/iec/test_survival_recurrence.py"
      - "tests/iec/test_survival_ocel.py"
      - "tests/iec/test_survival_bundle.py"
      - "tests/iec/test_survival_uncertainty.py"
      - "tests/iec/test_survival_guard.py"
      - ".github/workflows/premature-actuation-survival.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survival-court:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Admit exact subject
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf "survival_exact_head=%s\n" "$actual"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # The survival courts are pure Python; a full dependency sync would compile the
      # whole C++ extension (Boost, CMake) for no benefit, as autonomic-survival.yml avoids.
      - name: Install focused court dependencies
        run: python -m pip install "pytest==8.3.5" "ruff==0.14.0"

      - name: Compile survival surface
        run: |
          python -m compileall -q \
            src/autofde_lab/iec/crowns/survival.py \
            src/autofde_lab/iec/crowns/survival_compare.py \
            src/autofde_lab/iec/crowns/survival_recurrence.py \
            src/autofde_lab/iec/crowns/survival_ocel.py \
            src/autofde_lab/iec/crowns/survival_bundle.py \
            src/autofde_lab/iec/crowns/survival_uncertainty.py \
            src/autofde_lab/iec/crowns/survival_guard.py \
            tests/iec/test_survival_benchmark.py \
            tests/iec/test_survival_compare.py \
            tests/iec/test_survival_recurrence.py \
            tests/iec/test_survival_ocel.py \
            tests/iec/test_survival_bundle.py \
            tests/iec/test_survival_uncertainty.py \
            tests/iec/test_survival_guard.py \

      - name: Execute survival courts
        run: |
          python -m pytest -q \
            tests/iec/test_survival_benchmark.py \
            tests/iec/test_survival_compare.py \
            tests/iec/test_survival_recurrence.py \
            tests/iec/test_survival_ocel.py \
            tests/iec/test_survival_bundle.py \
            tests/iec/test_survival_uncertainty.py \
            tests/iec/test_survival_guard.py \

      - name: Static contract
        run: |
          ruff check \
            src/autofde_lab/iec/crowns/survival.py \
            src/autofde_lab/iec/crowns/survival_compare.py \
            src/autofde_lab/iec/crowns/survival_recurrence.py \
            src/autofde_lab/iec/crowns/survival_ocel.py \
            src/autofde_lab/iec/crowns/survival_bundle.py \
            src/autofde_lab/iec/crowns/survival_uncertainty.py \
            src/autofde_lab/iec/crowns/survival_guard.py \
            tests/iec/test_survival_benchmark.py \
            tests/iec/test_survival_compare.py \
            tests/iec/test_survival_recurrence.py \
            tests/iec/test_survival_ocel.py \
            tests/iec/test_survival_bundle.py \
            tests/iec/test_survival_uncertainty.py \
            tests/iec/test_survival_guard.py \

      - name: Format contract
        run: |
          ruff format --check \
            src/autofde_lab/iec/crowns/survival.py \
            src/autofde_lab/iec/crowns/survival_compare.py \
            src/autofde_lab/iec/crowns/survival_recurrence.py \
            src/autofde_lab/iec/crowns/survival_ocel.py \
            src/autofde_lab/iec/crowns/survival_bundle.py \
            src/autofde_lab/iec/crowns/survival_uncertainty.py \
            src/autofde_lab/iec/crowns/survival_guard.py \
            tests/iec/test_survival_benchmark.py \
            tests/iec/test_survival_compare.py \
            tests/iec/test_survival_recurrence.py \
            tests/iec/test_survival_ocel.py \
            tests/iec/test_survival_bundle.py \
            tests/iec/test_survival_uncertainty.py \
            tests/iec/test_survival_guard.py \
