name: POWL deterministic format repair

on:
  push:
    branches:
      - agent/powl-v2-concurrent-runner
    paths:
      - .github/workflows/powl-format-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Admit repair predecessor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e03f1a2e9f8832edb7985d37915d9d827896a086"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/powl-format-repair.yml"
      - name: Install exact repository Ruff
        run: python -m pip install --disable-pip-version-check 'ruff==0.14.0'
      - name: Apply repository deterministic transforms
        shell: bash
        run: |
          set -euo pipefail
          ruff check --fix --select=I src/autofde_lab/powl/pipeline_runner.py
          ruff check --fix --select=F401 src/autofde_lab/powl/pipeline_runner.py
          ruff format src/autofde_lab/powl/pipeline_runner.py
          ruff check --select=I,F401 src/autofde_lab/powl/pipeline_runner.py
          ruff format --check src/autofde_lab/powl/pipeline_runner.py
      - name: Refuse semantic scope widening
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "src/autofde_lab/powl/pipeline_runner.py"
      - name: Commit formatter-equivalent repair and remove capsule
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatman-ecosystem-control-plane'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/powl-format-repair.yml
          git add src/autofde_lab/powl/pipeline_runner.py
          git commit -m 'style(powl): apply deterministic Ruff repair'
          git push origin HEAD:agent/powl-v2-concurrent-runner
