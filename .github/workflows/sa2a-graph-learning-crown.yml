name: SA2A graph-learning crown

on:
  pull_request:
    branches: [master]
    paths:
      - "src/autofde_lab/sa2a/graph_learning/**"
      - "tests/sa2a/test_graph_learning.py"
      - "docs/sa2a/graph-learning.md"
      - ".github/workflows/sa2a-graph-learning-crown.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sa2a-graph-learning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  crown:
    name: Exact-head GraphSAGE candidate/admission court
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'sa2a_graph_learning_exact_head=%s\n' "$actual"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install bounded graph-learning court
        run: |
          python -m pip install \
            "pytest==8.3.5" \
            "pydantic>=2,<3" \
            "rdflib==7.2.1" \
            "pyshacl>=0.30,<1" \
            "torch>=2.3,<3" \
            "torch-geometric>=2.5,<3"

      - name: Reject London-school test doubles
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'unittest\.mock|Mock\(|MagicMock|patch\(|monkeypatch' \
            tests/sa2a/test_graph_learning.py

      - name: Execute real GraphSAGE candidate/admission court
        env:
          PYTHONPATH: src
        run: python -m pytest -vv tests/sa2a/test_graph_learning.py
