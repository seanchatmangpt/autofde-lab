name: Temporary formatter patch

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: formatter-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install formatter
        run: python -m pip install "pre-commit==4.6.1"
      - name: Manufacture exact formatter patch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            git diff --name-only -z --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}"
          )
          pre-commit run --files "${files[@]}" || true
          git diff --binary > formatter.patch
          test -s formatter.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-formatter-patch
          path: formatter.patch
          if-no-files-found: error
          retention-days: 1
