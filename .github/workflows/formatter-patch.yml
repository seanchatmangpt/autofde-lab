name: Temporary formatter patch

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: formatter-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install formatter
        run: python -m pip install "pre-commit==4.6.1"
      - name: Manufacture and verify exact formatter diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            git diff --name-only -z --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}" \
              HEAD
          )
          pre-commit run --files "${files[@]}" || true
          pre-commit run --files "${files[@]}"
      - name: Publish formatter-only commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formatter is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply deterministic pre-commit formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
