name: Ggen projection manufacturer

on:
  pull_request:
    paths:
      - "ggen.toml"
      - "ontology/**"
      - "templates/python/**"
      - "src/autofde_lab/constitution/**"
      - "tests/constitution/test_semantic_constitution.py"
      - "scripts/verify-ggen-constitution.sh"
      - ".github/workflows/ggen-projection-witness.yml"

permissions:
  contents: write

jobs:
  manufacture:
    name: Manufacture canonical projections
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          submodules: false
          persist-credentials: true

      - name: Assert exact branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Run pinned ggen manufacturer
        shell: bash
        run: |
          set -euo pipefail
          asset="ggen-x86_64-unknown-linux-gnu.tar.gz"
          expected="c651d873c2aeb6bd71c3d5356634f0b3f4adafd2454ee354c817a7079c2ea802"
          workdir="$(mktemp -d)"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            "https://github.com/seanchatmangpt/ggen/releases/download/v26.8.8/${asset}" \
            --output "${workdir}/${asset}"
          actual="$(sha256sum "${workdir}/${asset}" | cut -d' ' -f1)"
          test "${actual}" = "${expected}"
          tar -xzf "${workdir}/${asset}" -C "${workdir}"
          ggen_bin="$(find "${workdir}" -type f -name ggen -print -quit)"
          test -n "${ggen_bin}"
          chmod +x "${ggen_bin}"
          "${ggen_bin}" sync run
          git diff --name-only -- src/autofde_lab/constitution tests/constitution/test_semantic_constitution.py
          test -n "$(git status --porcelain -- src/autofde_lab/constitution tests/constitution/test_semantic_constitution.py)"

      - name: Commit exact manufacturer consequence and retire helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autofde_lab/constitution tests/constitution/test_semantic_constitution.py
          git rm .github/workflows/ggen-projection-witness.yml
          git commit -m "ggen: refresh semantic constitution projections"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
