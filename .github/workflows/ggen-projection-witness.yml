name: Ggen projection witness

on:
  pull_request:
    paths:
      - "ggen.toml"
      - "ontology/**"
      - "templates/python/**"
      - "src/autofde_lab/constitution/**"
      - "tests/constitution/test_semantic_constitution.py"
      - "scripts/verify-ggen-constitution.sh"
      - ".github/workflows/ggen-projection-witness.yml"

permissions:
  contents: read

jobs:
  witness:
    name: Manufacture projection witness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Run pinned ggen manufacturer
        shell: bash
        run: |
          set -euo pipefail
          asset="ggen-x86_64-unknown-linux-gnu.tar.gz"
          expected="c651d873c2aeb6bd71c3d5356634f0b3f4adafd2454ee354c817a7079c2ea802"
          workdir="$(mktemp -d)"
          curl --fail --location --silent --show-error \
            "https://github.com/seanchatmangpt/ggen/releases/download/v26.8.8/${asset}" \
            --output "${workdir}/${asset}"
          actual="$(sha256sum "${workdir}/${asset}" | cut -d' ' -f1)"
          test "${actual}" = "${expected}"
          tar -xzf "${workdir}/${asset}" -C "${workdir}"
          ggen_bin="$(find "${workdir}" -type f -name ggen -print -quit)"
          test -n "${ggen_bin}"
          chmod +x "${ggen_bin}"
          "${ggen_bin}" sync run
          git diff --name-only -- src/autofde_lab/constitution tests/constitution/test_semantic_constitution.py > ggen-projection-changed.txt
          tar -czf ggen-projection-witness.tar.gz \
            src/autofde_lab/constitution \
            tests/constitution/test_semantic_constitution.py \
            ggen-projection-changed.txt

      - name: Upload exact manufactured projection
        uses: actions/upload-artifact@v4
        with:
          name: ggen-projection-witness
          path: ggen-projection-witness.tar.gz
          if-no-files-found: error
          retention-days: 1
