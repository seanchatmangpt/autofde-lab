name: Refresh uv lock for Git sources

on:
  push:
    branches: [agent/replace-local-uv-sources]

permissions:
  contents: write

concurrency:
  group: refresh-uv-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/replace-local-uv-sources
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Pin AutoFDE-Lab to the hardened GymAct source revision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("pyproject.toml")
          text = path.read_text()
          old = 'gymact = { git = "https://github.com/seanchatmangpt/gymact.git", rev = "7f5048dcd62514a1ece3cc3bb04d41462ab6a97b" }'
          new = 'gymact = { git = "https://github.com/seanchatmangpt/gymact.git", rev = "524d0bc8633d8534f500d67f27384ce9368c0863" }'
          if old in text:
              path.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit("REFUSED: expected GymAct source binding not found")
          PY

      - name: Regenerate lock from exact Git sources
        id: lock
        shell: bash
        run: |
          set +e
          uv lock > uv-lock.log 2>&1
          status=$?
          cat uv-lock.log
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve lock regeneration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock-regeneration-${{ github.sha }}
          path: |
            uv-lock.log
            uv.lock
          if-no-files-found: error
          retention-days: 7

      - name: Verify regenerated lock
        if: steps.lock.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'editable = "\.\./(gymact|wasm4pm-compat/python)"|/Users/sac/' uv.lock
          grep -Fq 'https://github.com/seanchatmangpt/gymact.git?rev=524d0bc8633d8534f500d67f27384ce9368c0863' uv.lock
          grep -Fq 'https://github.com/seanchatmangpt/wasm4pm-compat.git?subdirectory=python&rev=577e2d1d8bdfe27d96f61c63f3ea120994e8bfda' uv.lock

      - name: Commit hardened source binding and regenerated lock
        if: steps.lock.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pyproject.toml uv.lock; then
            echo "pyproject.toml and uv.lock already match exact Git sources"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore: regenerate uv lock for GitHub sources"
          git push origin HEAD:agent/replace-local-uv-sources

      - name: Refuse failed lock resolution
        if: steps.lock.outputs.status != '0'
        run: exit 2
