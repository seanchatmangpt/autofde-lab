name: Delegation admission courts

on:
  pull_request:
    paths:
      - "src/autofde_lab/iec/crowns/delegation_admission*.py"
      - "src/autofde_lab/iec/delegation_admission_formal.py"
      - "tests/iec/test_delegation_admission*.py"
      - "tests/iec/test_tlc_delegation_admission.py"
      - "docs/2026-09-25-delegation-admission*.md"
      - ".github/workflows/delegation-admission.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-courts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Admit exact subject
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'delegation_admission_exact_head=%s\n' "$actual"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install narrow court dependencies
        run: python -m pip install "pytest==8.3.5"

      - name: Execute snapshot mutation history and batch courts
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q             tests/iec/test_delegation_admission.py             tests/iec/test_delegation_admission_benchmark.py             tests/iec/test_delegation_admission_history.py             tests/iec/test_delegation_admission_batch.py
