name: Temporary Ruff Fix

on:
  push:
    branches:
      - agent/planner-league-ggen

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out formatting subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/planner-league-ggen
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install repository Ruff version
        run: python -m pip install 'ruff==0.14.0'
      - name: Normalize exact failed surface
        run: |
          set -euo pipefail
          files=(
            src/autofde_lab/fortune5/enterprise_architecture_board.py
            src/autofde_lab/fortune5/enterprise_architecture_catalog.py
            src/autofde_lab/planner_league/catalog.py
            src/autofde_lab/planner_league/core.py
            tests/fortune5/test_enterprise_architecture_board.py
            tests/planner_league/test_planner_league.py
          )
          ruff check --fix --select=I,F401 "${files[@]}"
          ruff format "${files[@]}"
      - name: Commit formatter output
        run: |
          set -euo pipefail
          files=(
            src/autofde_lab/fortune5/enterprise_architecture_board.py
            src/autofde_lab/fortune5/enterprise_architecture_catalog.py
            src/autofde_lab/planner_league/catalog.py
            src/autofde_lab/planner_league/core.py
            tests/fortune5/test_enterprise_architecture_board.py
            tests/planner_league/test_planner_league.py
          )
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo 'ruff_changes=none'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply repository Ruff normalization'
          git push origin HEAD:agent/planner-league-ggen
