name: DSPy WebAssembly court

on:
  push:
    branches:
      - feat/dspy-wasm-court-v26.9.25
    paths:
      - src/autofde_lab/wasm/dspy.py
      - tests/wasm/test_dspy_wasm.py
      - wasm/dspy-wasm/**
      - .github/workflows/dspy-wasm-court.yml
  pull_request:
    paths:
      - src/autofde_lab/wasm/dspy.py
      - tests/wasm/test_dspy_wasm.py
      - wasm/dspy-wasm/**
      - .github/workflows/dspy-wasm-court.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dspy-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  court:
    name: DSPy 3.4.0 / Pyodide 314.0.7
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install host verifier
        run: python -m pip install "pytest==8.3.5"

      - name: Verify host protocol court
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/wasm/test_dspy_wasm.py -k 'not real_node_pyodide_probe'

      - name: Materialize exact Pyodide runtime
        working-directory: wasm/dspy-wasm
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Execute real guest court
        id: guest
        working-directory: wasm/dspy-wasm
        shell: bash
        run: |
          set -euo pipefail
          node probe.mjs | tee observation.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("observation.json")
          rows = [line for line in path.read_text().splitlines() if line.strip()]
          assert len(rows) == 1, f"expected one observation row, got {len(rows)}"
          observation = json.loads(rows[0])
          print("standing=", observation["status"])
          print("subject=", observation["subject"])
          print("stages=", observation["stages"])
          print("blocker=", observation["blocker"])
          if observation["status"] != "ALIVE":
              raise SystemExit(1)
          assert observation["output"]["module_output"] == "WASM"
          assert observation["output"]["host_output"] == "WASM-HOST"
          assert observation["output"]["host_calls"] == 1
          assert observation["output"]["provider_io"] is False
          assert observation["output"]["authority"]["actuation"] == "none"
          PY

      - name: Run real Python wrapper court
        if: success()
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/wasm/test_dspy_wasm.py

      - name: Preserve exact observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dspy-wasm-${{ github.sha }}
          path: wasm/dspy-wasm/observation.json
          if-no-files-found: warn
          retention-days: 14
