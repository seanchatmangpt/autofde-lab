name: Autonomous discovery crown

on:
  pull_request:
    paths:
      - "src/autofde_lab/hub/domain/gym_procedure/**"
      - "scripts/validate_autonomous_discovery.py"
      - "tests/test_autonomous_procedure_discovery.py"
      - ".github/workflows/autonomous-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crown:
    name: 35-recipe no-leak crown
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout autofde-lab exact head
        uses: actions/checkout@v4

      - name: Checkout gymact discovery head
        uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/gymact
          ref: agent/receipted-autonomous-discovery-20260808
          path: gymact-repo

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install GymAct exact head
        run: python -m pip install -e ./gymact-repo

      - name: Compile discovery surfaces
        run: |
          python -m py_compile \
            src/autofde_lab/hub/domain/gym_procedure/discovery.py \
            scripts/validate_autonomous_discovery.py \
            gymact-repo/src/gymact/discovery.py \
            gymact-repo/src/gymact/gyms/opaque_procedure.py

      - name: Unit validate autonomous selector
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_autonomous_procedure_discovery.py

      - name: Execute full autonomous discovery crown
        env:
          PYTHONPATH: src
        run: |
          python scripts/validate_autonomous_discovery.py \
            --output reports/autonomous-discovery/receipt.json

      - name: Assert crown receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("reports/autonomous-discovery/receipt.json")
          receipt = json.loads(path.read_text())
          assert receipt["standing"] == "ALIVE", receipt
          assert receipt["corpus_size"] == 35, receipt["corpus_size"]
          assert receipt["alive"] == 35, receipt["alive"]
          assert all(count == 35 for count in receipt["pattern_counts"].values())
          assert all(item["goal_verified"] for item in receipt["results"])
          assert all(item["ocel_schema_valid"] for item in receipt["results"])
          assert all(item["lifecycle_conformant"] for item in receipt["results"])
          print("AUTONOMOUS_DISCOVERY_CROWN=ALIVE 35/35")
          PY

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-discovery-receipt
          path: reports/autonomous-discovery/receipt.json
          if-no-files-found: error
