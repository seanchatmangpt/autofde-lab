name: Monte Carlo stopping qualification

on:
  pull_request:
    branches: [master]
    paths:
      - "src/autofde_lab/reasoning/montecarlo_stopping.py"
      - "tests/reasoning/test_montecarlo_stopping_chicago.py"
      - ".github/workflows/montecarlo-stopping-qualification.yml"

permissions:
  contents: read

jobs:
  montecarlo-stopping:
    name: Exact-head Monte Carlo stopping court
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$expected" ]] || {
            echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=$actual expected=$expected"
            exit 2
          }
          printf 'exact_head=%s\n' "$actual"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install bounded validation capsule
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pytest==8.3.5"

      - name: Reject mockist seams in the owning court
        shell: bash
        run: |
          ! grep -nE 'unittest\.mock|\bMock\(|\bMagicMock\(|\bpatch\(|monkeypatch' \
            tests/reasoning/test_montecarlo_stopping_chicago.py

      - name: Compile exact feature surface
        run: >-
          python -m py_compile
          src/autofde_lab/reasoning/montecarlo_stopping.py
          tests/reasoning/test_montecarlo_stopping_chicago.py
          tests/reasoning/test_montecarlo_chicago.py

      - name: Execute real Monte Carlo stopping court
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest
          tests/reasoning/test_montecarlo_stopping_chicago.py
          tests/reasoning/test_montecarlo_chicago.py
          -v
