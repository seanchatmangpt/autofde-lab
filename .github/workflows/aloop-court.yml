name: ALOOP autonomous-loop court

on:
  pull_request:
    branches: [master]
    paths:
      - "src/autofde_lab/aloop/**"
      - "src/autofde_lab/ocel/**"
      - "tests/aloop/**"
      - "schemas/aloop/**"
      - "docs/rfcs/RFC-ALOOP-v26.9.25.md"
      - "docs/rfcs/aloop/**"
      - ".github/workflows/aloop-court.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  court:
    name: Exact-head ALOOP-001 court + mutants + real trace replay
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf "aloop_exact_head=%s\n" "$actual"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install focused court
        run: python -m pip install "pytest==8.3.5" "jsonschema>=4.23,<5"

      - name: Reject London-school test doubles
        shell: bash
        run: |
          set -euo pipefail
          # *.py only: the committed crown observations record a grep command
          # string containing these tokens as evidence bytes, not as test code.
          ! grep -R -nE --include='*.py' "unittest\\.mock|Mock\\(|MagicMock|patch\\(|monkeypatch" tests/aloop

      - name: Execute ALOOP-001 court
        env:
          PYTHONPATH: src
        run: python -m pytest -vv -p no:cacheprovider tests/aloop

      - name: Replay committed real-trace receipt (exit 3 expected, typed)
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -uo pipefail
          locator="$(python -c 'import json;print(json.load(open("docs/rfcs/aloop/ALOOP-001-chatman-root-crown-v26.9.25.json"))["log"]["locator"])')"
          python -m autofde_lab.aloop \
            tests/aloop/fixtures/chatman_root_crown_v26_9_25/chatman-root-crown-v26.9.25.ocel.json \
            --locator "$locator" --out "$RUNNER_TEMP/replay.json"
          code=$?
          test "$code" = 3
          python - "$RUNNER_TEMP/replay.json" <<'PY'
          import json, sys
          a = json.load(open(sys.argv[1]))
          b = json.load(open("docs/rfcs/aloop/ALOOP-001-chatman-root-crown-v26.9.25.json"))
          assert a == b, "committed receipt does not replay"
          print("replay_receipt_digest=" + a["receipt_digest"])
          PY
