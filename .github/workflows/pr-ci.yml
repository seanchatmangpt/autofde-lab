name: ⚡ Pull request CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  classify:
    name: Classify change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cache: ${{ steps.routes.outputs.cache }}
      python: ${{ steps.routes.outputs.python }}
      package: ${{ steps.routes.outputs.package }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: routes
        name: Route changed paths
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            printf 'cache=true\npython=true\npackage=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > changed-files.txt
          cat changed-files.txt

          route() {
            local name="$1"
            local pattern="$2"
            if grep -Eq "$pattern" changed-files.txt; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }

          route cache \
            '^(src/skdecide/(caching\.py|_cache/)|tests/test_(caching|enterprise_cache)\.py|\.github/workflows/)'
          route python '^(src/|tests/|examples/|pyproject\.toml|uv\.lock|\.github/workflows/)'
          route package '^(src/|cpp/|scripts/|pyproject\.toml|uv\.lock|CMakeLists\.txt|\.github/workflows/)'

  quality:
    name: Deterministic quality
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: python -m pip install "pre-commit==4.6.1"
      - name: Check proposed files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            pre-commit run --show-diff-on-failure --color=always --all-files
            exit 0
          fi
          mapfile -d '' files < <(
            git diff --name-only -z --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}"
          )
          if (( ${#files[@]} == 0 )); then
            echo "No checkable files changed."
            exit 0
          fi
          pre-commit run \
            --show-diff-on-failure \
            --color=always \
            --files "${files[@]}"

  cache:
    name: Cache verifier / Python ${{ matrix.python-version }}
    needs: classify
    if: needs.classify.outputs.cache == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install focused verifier dependencies
        run: |
          python -m pip install \
            "numpy==2.2.6" \
            "pytest==8.3.5" \
            "wrapt>=2.2.1,<3" \
            "pynng>=0.6.2" \
            "pathos>=0.2.7" \
            "discrete-optimization>=0.9.0"
      - name: Compile cache sources
        run: python -m compileall -q src/skdecide/_cache src/skdecide/caching.py
      - name: Run cache qualification
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_caching.py \
            tests/test_enterprise_cache.py

  python-smoke:
    name: Python source smoke
    needs: classify
    if: needs.classify.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Compile source and tests without writing bytecode
        shell: python
        run: |
          from pathlib import Path

          roots = (Path("src"), Path("tests"), Path("examples"))
          for root in roots:
              for path in root.rglob("*.py"):
                  compile(path.read_bytes(), str(path), "exec")
      - name: Reject conflict markers
        shell: bash
        run: "! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- ':!uv.lock'"

  package:
    name: Source package smoke
    needs: classify
    if: needs.classify.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build source distribution
        run: |
          python -m pip install "build==1.2.2"
          python -m build --sdist
      - name: Verify source distribution contract
        shell: bash
        run: |
          set -euo pipefail
          archive=$(printf '%s\n' dist/*.tar.gz)
          tar -tzf "$archive" > sdist-files.txt
          grep -Eq '/pyproject\.toml$' sdist-files.txt
          grep -Eq '/src/skdecide/__init__\.py$' sdist-files.txt
          grep -Eq '/src/skdecide/_cache/' sdist-files.txt
          test "$(wc -c < "$archive")" -gt 10000

  gate:
    name: CI gate
    if: always()
    needs: [classify, quality, cache, python-smoke, package]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Admit successful or intentionally skipped routes
        env:
          CLASSIFY: ${{ needs.classify.result }}
          QUALITY: ${{ needs.quality.result }}
          CACHE: ${{ needs.cache.result }}
          PYTHON_SMOKE: ${{ needs.python-smoke.result }}
          PACKAGE: ${{ needs.package.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "$CLASSIFY" \
            "$QUALITY" \
            "$CACHE" \
            "$PYTHON_SMOKE" \
            "$PACKAGE"; do
            case "$result" in
              success|skipped) ;;
              *) echo "CI route ended with: $result"; exit 1 ;;
            esac
          done
