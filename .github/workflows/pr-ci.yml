name: ⚡ Pull request CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-serial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  qualification:
    name: Exact-head qualification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install bounded qualification dependencies
        run: |
          python -m pip install "pre-commit==4.6.1" "build==1.2.2" "pytest==8.3.5" "wrapt>=2.2.1,<3" "pynng>=0.6.2" "pathos>=0.2.7" "discrete-optimization>=0.9.0"

      - name: Quality changed files
        run: |
          mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          if (( ${#files[@]} )); then pre-commit run --show-diff-on-failure --color=always --files "${files[@]}"; fi

      - name: Compile Python
        run: python -m compileall -q src/autofde_lab benchmarks tests/fabric/test_issue_reasoning.py

      - name: Execute Crown kernel
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/autofde/test_authority.py \
            tests/autofde/test_bootstrap.py \
            tests/fabric/test_brce.py \
            tests/fabric/test_brce_identity.py \
            tests/fabric/test_public_ontology.py \
            tests/fabric/test_world_model.py \
            tests/fabric/test_guardrails.py \
            tests/fabric/test_self_play.py \
            tests/fabric/test_query_plane.py \
            tests/fabric/test_selection.py \
            tests/fabric/test_selection_store.py \
            tests/fabric/test_metrics.py \
            tests/fabric/test_cognition_debt.py \
            tests/fabric/test_causal_placement.py \
            tests/fabric/test_handoff.py \
            tests/fabric/test_differential_verification.py \
            tests/fabric/test_competitive_benchmark.py \
            tests/fabric/test_coverage_bridge.py \
            tests/fabric/test_hot_path.py \
            tests/fabric/test_crown.py \
            tests/fabric/test_crown_evidence.py \
            tests/fabric/test_crown_errc.py \
            tests/fabric/test_issue_reasoning.py

      - name: Execute 8x8 Challenger value benchmark
        env:
          PYTHONPATH: src
        run: |
          python benchmarks/challenger_issue_reasoning.py --repeats 100000 --output challenger-issue-reasoning.csv | tee challenger-summary.json
          python - <<'PY'
          import csv, json
          rows=list(csv.DictReader(open('challenger-issue-reasoning.csv', encoding='utf-8')))
          assert len(rows)==8
          assert sum(int(r['calls']) for r in rows)==6_400_000
          assert all(int(r['tool_uses_per_portfolio'])==8 for r in rows)
          assert all(r['actuation']=='REFUSED' for r in rows)
          assert all(float(r['calls_per_second'])>0 for r in rows)
          print(json.dumps({'validated_case_studies':8,'validated_tool_uses_per_portfolio':8,'direct_calls':6_400_000,'actuation':'REFUSED'}, sort_keys=True))
          PY

      - name: Source package smoke
        run: |
          python -m build --sdist
          archive=$(printf '%s\n' dist/*.tar.gz)
          tar -tzf "$archive" > sdist-files.txt
          grep -Eq '/pyproject\.toml$' sdist-files.txt
          grep -Eq '/src/autofde_lab/__init__\.py$' sdist-files.txt
          test "$(wc -c < "$archive")" -gt 10000

      - uses: actions/upload-artifact@v4
        with:
          name: challenger-issue-reasoning-${{ github.sha }}
          path: |
            challenger-issue-reasoning.csv
            challenger-summary.json
          if-no-files-found: error
