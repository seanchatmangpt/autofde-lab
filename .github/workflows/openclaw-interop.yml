name: OpenClaw interoperability

on:
  pull_request:
    paths:
      - "src/skdecide/openclaw_bridge.py"
      - "src/skdecide/openclaw_runtime.py"
      - "tests/test_openclaw_bridge.py"
      - "integrations/openclaw/**"
      - ".github/workflows/openclaw-interop.yml"
  push:
    branches: [master]
    paths:
      - "src/skdecide/openclaw_bridge.py"
      - "src/skdecide/openclaw_runtime.py"
      - "tests/test_openclaw_bridge.py"
      - "integrations/openclaw/**"
      - ".github/workflows/openclaw-interop.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - name: Install focused Python verifier
        run: python -m pip install "pytest>=6.2.2,<8.4"
      - name: Verify Python bridge
        run: python -m pytest tests/test_openclaw_bridge.py -q
      - name: Install pinned OpenClaw SDK and build dependencies
        working-directory: integrations/openclaw
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify OpenClaw package contracts
        working-directory: integrations/openclaw
        run: |
          npm run check
          git diff --exit-code -- dist/index.js
          npm pack --dry-run
