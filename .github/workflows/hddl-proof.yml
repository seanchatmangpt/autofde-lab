name: HDDL proof

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/autofde_lab/hub/domain/hddl/**"
      - "src/autofde_lab/hub/solver/hddl/**"
      - "tests/domains/python/test_hddl_bridge_domain.py"
      - ".github/workflows/hddl-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - name: Verify frozen dependency graph
        run: uv lock --check

  hddl-execution:
    runs-on: ubuntu-latest
    steps:
      # `uv sync --extra hddl` runs a real editable install, which triggers
      # scikit-build-core's native C++ extension build -- that build's
      # CMakeLists.txt ADD_SUBDIRECTORY()s cpp/sdk/{nng,pybind11,json,...},
      # real git submodules. actions/checkout's default submodules: false
      # left them empty, confirmed live on this exact PR: `CMake Error ...
      # does not contain a CMakeLists.txt file` for every cpp/sdk/* path,
      # `Unknown CMake command "PYBIND11_ADD_MODULE"` once pybind11's own
      # CMake module was unavailable as a result. recursive is required,
      # not just cpp/sdk/*, per this repo's other native-build workflows'
      # own convention.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - name: Resolve HDDL execution capsule
        run: uv sync --no-default-groups --extra hddl --group test
      - name: Execute real HDDL parse, Aries solve, decomposition, and replay
        run: uv run --no-default-groups --extra hddl --group test pytest tests/domains/python/test_hddl_bridge_domain.py -q
