name: GymAct validation carrier probe

on:
  push:
    branches: [agent/gymact-validation-carrier]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-private-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe repository-scoped token without reading private content
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/seanchatmangpt/gymact)
          echo "private_repo_http_status=$code"
          test "$code" = 200
