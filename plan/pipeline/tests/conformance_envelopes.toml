# Envelopes for test_jtbd_conformance.py. Activity names are ocel_bridge activities; SLA bounds are
# envelope seconds, never literals in test code.

[activities]
checkin = "checkin"
checkout = "checkout"
dispatch = "dispatch"
plan_closed = "plan_closed"
ledger_settled = "ledger_settled"
work_order = "work_order"
model_tag_media = "media:model_tag_photo"

[objects]
required = ["entity", "client", "site", "provider", "work_order"]
traversal = ["entity", "client", "site", "work_order", "provider"]

[ratios]
checkin_to_checkout = 1.0
plan_closed_to_ledger_settled = 1.0

[sla_seconds]
dispatch_to_checkin = 600
checkin_to_checkout = 600
work_order_to_ledger_settled = 900
